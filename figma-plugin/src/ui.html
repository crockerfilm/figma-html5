<style>
  /* The list scrolls and the footer sits below it, so the last card is never
     hidden behind the footer however tall the buttons wrap. */
  html, body { height: 100%; }
  body { margin: 0; font: 12px/1.45 Inter, -apple-system, system-ui, sans-serif;
    color: var(--figma-color-text); background: var(--figma-color-bg);
    display: flex; flex-direction: column; }
  .wrap { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }
  h1 { font-size: 13px; margin: 0 0 4px; }
  .muted { color: var(--figma-color-text-secondary); }
  .card { border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 10px; margin-top: 10px; }
  .card b { font-weight: 600; }
  .dismiss { float: right; margin-left: 8px; cursor: pointer; color: var(--figma-color-text-secondary); }
  .anim { margin: 6px 0 0; padding-left: 16px; }
  .warn { color: var(--figma-color-text-warning); margin-top: 6px; }
  .note { color: var(--figma-color-text-secondary); margin-top: 6px; font-style: italic; }
  details { margin-top: 8px; }
  summary { cursor: pointer; }
  .row { display: flex; gap: 6px; align-items: flex-start; padding: 3px 0; }
  .row a { color: var(--figma-color-text-brand); cursor: pointer; text-decoration: none; }
  .row .where { color: var(--figma-color-text-secondary); white-space: pre-line; }
  .foot { flex: none; padding: 10px 14px;
    background: var(--figma-color-bg); border-top: 1px solid var(--figma-color-border); }
  button { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand);
    border: 0; border-radius: 5px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; color: var(--figma-color-text); border: 1px solid var(--figma-color-border); font-weight: 500; }
  button.danger { background: var(--figma-color-bg-danger); color: var(--figma-color-text-ondanger); border-color: transparent; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  .steps label { display: flex; gap: 6px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  .total { font-weight: 600; margin-top: 8px; }
  .err { color: var(--figma-color-text-danger); }
  .ok { color: var(--figma-color-text-success); }
  .status { font-size: 11px; color: var(--figma-color-text-secondary); margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 15px; }
  .status.busy::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px;
    border-radius: 50%; background: var(--figma-color-text-brand); vertical-align: 1px;
    animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .xgroup span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xhead { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .xhead .sum { color: var(--figma-color-text-secondary); }
  .xhead .sp { flex: 1; }
  .xhead a, .xrow .name { color: var(--figma-color-text-brand); cursor: pointer; }
  .xgroup { display: flex; align-items: center; cursor: pointer; margin-top: 10px; font-size: 11px; color: var(--figma-color-text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--figma-color-border); padding-bottom: 3px; }
  .xrow { display: grid; grid-template-columns: 16px 1fr auto; gap: 2px 8px; align-items: center; padding: 5px 0; }
  .xrow .name { font-weight: 600; }
  .xrow .sub { color: var(--figma-color-text-secondary); font-weight: 400; margin-left: 4px; }
  .xrow .why { grid-column: 2 / 4; font-size: 11px; color: var(--figma-color-text-secondary); }
  .xrow .why.err { color: var(--figma-color-text-danger); }
  .xrow .why button { margin-top: 4px; padding: 4px 10px; font-size: 11px; }
  .pill { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 9px; white-space: nowrap;
    background: var(--figma-color-bg-secondary); color: var(--figma-color-text-secondary); }
  .pill.ok { background: rgba(20,174,92,.15); color: var(--figma-color-text-success); }
  .pill.err { background: rgba(242,72,34,.15); color: var(--figma-color-text-danger); }
  .pill.busy { color: var(--figma-color-text-brand); }
  .xopts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--figma-color-text-secondary); }
  .xopts select, .xopts input { background: var(--figma-color-bg-secondary); color: var(--figma-color-text); border: 1px solid var(--figma-color-border); border-radius: 4px; padding: 3px 4px; font: inherit; }
  #gallery { position: fixed; inset: 0; z-index: 10; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #111); display: flex; flex-direction: column; }
  #gallery .ghead { padding: 10px 14px; border-bottom: 1px solid var(--figma-color-border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #gallery .ggrid { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-wrap: wrap; gap: 16px; align-content: flex-start; }
  #gallery .tile { cursor: pointer; }
  #gallery .tile .frame { position: relative; overflow: hidden; border: 1px solid var(--figma-color-border); background: #000; }
  #gallery .tile .frame.bad { border-color: var(--figma-color-border-danger, #e5484d); }
  #gallery .tile iframe { border: 0; position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  #gallery .tile .cap { font-size: 11px; margin-top: 4px; max-width: 260px; }
  #gallery select, #gallery input[type=range] { font: inherit; }
  .modes { display: flex; margin: 10px 0 2px; border: 1px solid var(--figma-color-border); border-radius: 6px; overflow: hidden; }
  .modes button { flex: 1; border-radius: 0; background: transparent; color: var(--figma-color-text-secondary); font-weight: 500; padding: 7px 8px; }
  .modes button.on { background: var(--figma-color-bg-selected); color: var(--figma-color-text); font-weight: 600; }
</style>

<div class="wrap">
  <h1>Copy Motion</h1>
  <div class="modes">
    <button data-mode="content" class="on">Same content</button>
    <button data-mode="layout">Same layout</button>
    <button data-mode="suite">Whole suite</button>
    <button data-mode="export">Export</button>
  </div>
  <div class="muted" id="modeHelp"></div>
  <div id="result"></div>
  <div id="out"></div>
</div>
<div class="foot">
  <div class="status" id="status">Ready</div>
  <div class="btns">
    <button id="go" disabled>Copy animation</button>
    <button id="stop" class="danger hidden">Stop</button>
    <button id="clear" class="ghost" disabled>Remove other animation…</button>
  </div>
  <div class="muted" id="restoreRow" style="margin-top:6px" title="Use restore points rather than ⌘Z: a long run lands in Figma's undo history as many steps.">
    <span id="restoreText">Every run saves a restore point first.</span> <a id="browse" class="hidden" style="color:var(--figma-color-text-brand);cursor:pointer">Browse</a>
    <span style="float:right" title="Compare with the latest at crockerfilm.github.io/figma-html5">Copy Motion v__VERSION__</span>
  </div>
</div>

<script>
/* @converter */

/* ========================================================== motion → CSS ==== */
// Figma won't hand a plugin its animated SVG, so the animation is rebuilt here
// from the keyframes Figma Motion reports, the way Figma's own animated export
// writes it: per layer, one transform animation (move, then rotate and scale
// about the layer's centre) and one opacity animation. Where every channel
// shares its keyframes and a curve CSS can express, keyframes are exact;
// otherwise (springs, mixed timings) the motion is sampled, as Figma does.

const SVGNS = "http://www.w3.org/2000/svg";
// Figma's named curves, as cubic-bezier control points.
const BEZIER = {
  LINEAR: [0, 0, 1, 1], EASE_IN: [0.42, 0, 1, 1], EASE_OUT: [0, 0, 0.58, 1], EASE_IN_AND_OUT: [0.42, 0, 0.58, 1],
  EASE_IN_BACK: [0.3, -0.05, 0.7, -0.5], EASE_OUT_BACK: [0.45, 1.45, 0.8, 1], EASE_IN_AND_OUT_BACK: [0.7, -0.4, 0.4, 1.4],
  IN_QUAD: [0.11, 0, 0.5, 0], OUT_QUAD: [0.5, 1, 0.89, 1], IN_OUT_QUAD: [0.45, 0, 0.55, 1],
  IN_CUBIC: [0.32, 0, 0.67, 0], OUT_CUBIC: [0.33, 1, 0.68, 1], IN_OUT_CUBIC: [0.65, 0, 0.35, 1],
  IN_QUART: [0.5, 0, 0.75, 0], OUT_QUART: [0.25, 1, 0.5, 1], IN_OUT_QUART: [0.76, 0, 0.24, 1],
  IN_EXPO: [0.7, 0, 0.84, 0], OUT_EXPO: [0.16, 1, 0.3, 1], IN_OUT_EXPO: [0.87, 0, 0.13, 1]
};
// Figma's spring presets (mass 1), reduced to their damping ratio — the time
// axis is fitted to each segment, so the ratio alone sets the shape.
const SPRING_ZETA = { GENTLE: 15 / (2 * Math.sqrt(100)), QUICK: 20 / (2 * Math.sqrt(300)),
                      BOUNCY: 15 / (2 * Math.sqrt(600)), SLOW: 20 / (2 * Math.sqrt(80)) };

function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { if (X(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return Y(t);
  };
}

function spring(zeta) {
  zeta = Math.max(0.05, zeta);
  const w = 10;
  const x = t => {
    if (zeta < 1) {
      const wd = w * Math.sqrt(1 - zeta * zeta);
      return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
    }
    if (zeta === 1) return 1 - Math.exp(-w * t) * (1 + w * t);
    const s = Math.sqrt(zeta * zeta - 1), r1 = -w * (zeta - s), r2 = -w * (zeta + s);
    return 1 + (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r1 - r2);
  };
  // Fit the spring to the segment: it comes to rest (within 0.1%) at the end.
  let T = 0.01;
  for (let t = 0; t < 20; t += 0.005) if (Math.abs(1 - x(t)) > 0.001) T = t;
  return p => (p >= 1 ? 1 : x(p * T));
}

// { css: a CSS timing function, or null if CSS can't express it; f: progress }
function easing(e) {
  if (!e || e.type === "LINEAR") return { css: "linear", f: p => p };
  if (e.easingFunctionCubicBezier && e.type !== "HOLD") {
    const { x1, y1, x2, y2 } = e.easingFunctionCubicBezier;
    const r = v => +(+v).toFixed(4);
    return { css: `cubic-bezier(${r(x1)},${r(y1)},${r(x2)},${r(y2)})`, f: cubicBezier(x1, y1, x2, y2) };
  }
  if (BEZIER[e.type]) { const b = BEZIER[e.type]; return { css: `cubic-bezier(${b.join(",")})`, f: cubicBezier(...b) }; }
  if (e.type === "CUSTOM_CUBIC_BEZIER" && e.easingFunctionCubicBezier) {
    const { x1, y1, x2, y2 } = e.easingFunctionCubicBezier;
    return { css: `cubic-bezier(${x1},${y1},${x2},${y2})`, f: cubicBezier(x1, y1, x2, y2) };
  }
  if (e.type === "HOLD") return { css: "steps(1,end)", f: p => (p < 1 ? 0 : 1) };
  if (SPRING_ZETA[e.type]) return { css: null, f: spring(SPRING_ZETA[e.type]) };
  if (e.type === "CUSTOM_SPRING") {
    const sp = e.easingFunctionSpring || {};
    // Damping ratio from the physics (mass, stiffness, damping); older files may give a bounce.
    const zeta = sp.stiffness > 0 && sp.damping >= 0 ? sp.damping / (2 * Math.sqrt(sp.stiffness * (sp.mass > 0 ? sp.mass : 1)))
      : typeof sp.bounce === "number" ? 1 - sp.bounce : 0.7;
    return { css: null, f: spring(zeta) };
  }
  return { css: "ease", f: cubicBezier(0.25, 0.1, 0.25, 1), unknown: (e && e.type) || "unknown" };
}

const val = v => (typeof v === "number" ? v : v && v.value !== undefined ? v.value : 0);   // FLOAT → number, VECTOR → {x, y}; a resolved variable is a bare number
const keysOf = tr => (tr.keyframes || []).slice().sort((a, b) => a.timelinePosition - b.timelinePosition);
const mix = (a, b, e) => (typeof a === "object" ? { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e } : a + (b - a) * e);

function evalTrack(keys, t) {
  if (t <= keys[0].timelinePosition) return val(keys[0].value);
  const last = keys[keys.length - 1];
  if (t >= last.timelinePosition) return val(last.value);
  let i = 0;
  while (keys[i + 1].timelinePosition <= t) i++;
  const a = keys[i], b = keys[i + 1];
  const p = (t - a.timelinePosition) / (b.timelinePosition - a.timelinePosition);
  return mix(val(a.value), val(b.value), easing(a.easing).f(p));
}

// A property's value at time t: the base value, then each track applied in
// order — SET replaces, OFFSET adds, SCALE multiplies.
function evalBinding(binding, t) {
  let v = val(binding.baseValue);
  for (const tr of binding.tracks || []) {
    const keys = keysOf(tr);
    if (!keys.length) continue;
    const x = evalTrack(keys, t);
    const op = tr.keyframeOperation || "SET";
    const f = (a, b) => (op === "OFFSET" ? a + b : op === "SCALE" ? a * b : b);
    v = typeof v === "object" && typeof x === "object" ? { x: f(v.x, x.x), y: f(v.y, x.y) } : f(typeof v === "object" ? 0 : v, x);
  }
  return v;
}

// Figma Motion presets, from their settings to keyframe tracks shaped like the
// ones Figma reports. Settings and defaults are Figma's own, as it lists them
// to plugins (motion.preset_name.*).
const DIRECTION = { left: [-1, 0], right: [1, 0], top: [0, -1], bottom: [0, 1],
                    topleft: [-1, -1], topright: [1, -1], bottomleft: [-1, 1], bottomright: [1, 1] };
// Settings compared whatever their spelling ("slide_out", "slideOut", "Slide out").
const norm = v => String(v == null ? "" : v).toLowerCase().replace(/[^a-z]/g, "");
// Presets whose conversion hasn't been compared against Figma's own playback
// are flagged, so a wrong direction or distance is checked rather than shipped.
const UNVERIFIED = {
  rotation: "rotation", scale: "scale",
  diagonal: "a diagonal slide", customPosition: "a custom position move"
};
function presetTracks(pr) {
  const P = pr.props || {}, t0 = pr.start || 0;
  // A zero-length preset is an instant change: a hundredth of a second keeps
  // its start and end apart, so it lands on its end state.
  const d = Math.max(0.01, pr.duration != null ? pr.duration : (P.duration != null ? P.duration : 0.5));
  // A setting this doesn't know plays as the default, and says so.
  const odd = [];
  const pick = (key, known, fallback) => {
    const v = norm(P[key]);
    if (!v) return fallback;
    if (known.includes(v)) return v;
    odd.push(`${key} “${P[key]}”`);
    return fallback;
  };
  const ease = P.easing || { type: "EASE_OUT" };
  const F = v => ({ type: "FLOAT", value: v });
  const track = (op, from, to) => ({ keyframeOperation: op, keyframes: [
    { timelinePosition: t0, easing: ease, value: F(from) }, { timelinePosition: t0 + d, easing: ease, value: F(to) }] });
  const out = {}, add = (prop, base, tr) => { (out[prop] = out[prop] || { baseValue: F(base), tracks: [] }).tracks.push(tr); };
  const num = (v, dflt) => (typeof v === "number" ? v : dflt);
  const done = r => Object.assign(r, { odd });
  switch (pr.preset) {
    case "opacity": {
      const type = pick("type", ["fadein", "fadeout", "custom"], "fadein");
      const amount = num(P.amount, 0) / 100;
      const [a, b] = type === "fadeout" ? [1, amount] : type === "custom" ? [num(P.startFrame, 0) / 100, num(P.endFrame, 100) / 100] : [amount, 1];
      add("OPACITY", 1, track("SCALE", a, b));
      return done({ out });
    }
    case "position": {
      const type = pick("type", ["slidein", "slideout", "custom"], "slidein");
      let sx, sy, ex, ey, diag = false;
      if (type === "custom") { sx = num(P.startX, 200); sy = num(P.startY, 200); ex = num(P.endX, 0); ey = num(P.endY, 0);
        const axis = pick("axis", ["x", "y", "xy", "both"], "");
        if (axis === "x") { sy = ey = 0; } if (axis === "y") { sx = ex = 0; } }
      else {
        const dir = pick("direction", Object.keys(DIRECTION), "left");
        const [dx, dy] = DIRECTION[dir], D = num(P.distance, 200);
        diag = !!(dx && dy);
        const off = [dx * D, dy * D];
        [sx, sy, ex, ey] = type === "slideout" ? [0, 0, off[0], off[1]] : [off[0], off[1], 0, 0];
      }
      if (sx || ex) add("TRANSLATION_X", 0, track("OFFSET", sx, ex));
      if (sy || ey) add("TRANSLATION_Y", 0, track("OFFSET", sy, ey));
      return done({ out, check: type === "custom" ? UNVERIFIED.customPosition : diag ? UNVERIFIED.diagonal : "" });
    }
    case "scale": {
      const type = pick("type", ["scalein", "scaleout", "custom"], "scalein");
      if (type === "custom") return done({ out, unsupported: "a custom scale" });
      const axis = pick("axis", ["h", "w", "x", "y", "both", "xy"], "");
      const A = num(P.amount, 120) / 100, [a, b] = type === "scaleout" ? [1, A] : [A, 1];
      if (axis !== "h" && axis !== "y") add("SCALE_X", 1, track("SCALE", a, b));
      if (axis !== "w" && axis !== "x") add("SCALE_Y", 1, track("SCALE", a, b));
      return done({ out, check: UNVERIFIED.scale });
    }
    case "rotation": {
      // Figma measures rotation anticlockwise. Turning in clockwise starts
      // that far anticlockwise and comes back to rest.
      const type = pick("type", ["rotatein", "rotateout", "custom"], "rotatein");
      const dir = pick("direction", ["clockwise", "counterclockwise", "anticlockwise"], "clockwise");
      const A = num(P.amount, 180), sign = dir === "clockwise" ? 1 : -1;
      const [a, b] = type === "custom" ? [num(P.start, 180), num(P.end, 0)] : type === "rotateout" ? [0, -sign * A] : [sign * A, 0];
      add("ROTATION", 0, track("OFFSET", a, b));
      return done({ out, check: UNVERIFIED.rotation });
    }
    case "size": return done({ out, unsupported: "a size (width/height)" });
    case "path": return done({ out, unsupported: "a path draw" });
    case "textstagger": return done({ out, unsupported: "a per-letter text" });
    default: return done({ out, unsupported: `the “${pr.name}” preset's` });
  }
}

const TRANSFORM_PROPS = ["TRANSLATION_X", "TRANSLATION_Y", "TRANSLATION_XY", "ROTATION", "SCALE_X", "SCALE_Y", "SCALE_XY"];
const CONVERTED = new Set(TRANSFORM_PROPS.concat(["OPACITY"]));
const PROP_LABEL = { WIDTH: "width", HEIGHT: "height", CORNER_RADIUS: "corner radius", STROKE_WEIGHT: "stroke weight",
                     fills: "fill colour", strokes: "stroke colour", effects: "effects (blur, shadow)" };

function layerMotion(anim) {
  // Hand-placed keyframes as Figma reports them, plus every preset turned
  // into the same kind of tracks.
  const A = JSON.parse(JSON.stringify(anim.animations || {}));
  const presetNotes = [], checks = [];
  // Hand-placed turns and scales pivot and sign the same way as the presets,
  // which haven't been compared with Figma's playback either.
  if (A.ROTATION || A.SCALE_X || A.SCALE_Y || A.SCALE_XY) checks.push("hand-placed rotation or scale");
  const oddNotes = [];
  for (const pr of anim.presets || []) {
    const { out, unsupported, check, odd } = presetTracks(pr);
    if (unsupported) presetNotes.push(`${unsupported}${pr.from ? ` (in “${pr.from}”)` : ""}`);
    if (check) checks.push(check);
    if (odd && odd.length) oddNotes.push(`its “${pr.name}” setting ${odd.join(", ")} isn't one this knows, so it plays with the default`);
    for (const k of Object.keys(out)) {
      if (A[k] && Array.isArray(A[k].tracks)) A[k].tracks = A[k].tracks.concat(out[k].tracks);
      else A[k] = out[k];
    }
  }
  const B = k => (A[k] && (A[k].tracks || []).length ? A[k] : null);
  const unsupported = Object.keys(A).filter(k => !CONVERTED.has(k) && A[k] && (typeof A[k] !== "object" || Object.keys(A[k]).length))
    .map(k => PROP_LABEL[k] || k.toLowerCase().replace(/_/g, " "));
  const base = (k, d) => (B(k) && B(k).baseValue ? val(B(k).baseValue) : d);
  const ratio = (v, b) => (b ? v / b : v);
  const at = t => {
    let tx = 0, ty = 0, r = 0, sx = 1, sy = 1, o = 1;
    if (B("TRANSLATION_X")) tx += evalBinding(B("TRANSLATION_X"), t) - base("TRANSLATION_X", 0);
    if (B("TRANSLATION_Y")) ty += evalBinding(B("TRANSLATION_Y"), t) - base("TRANSLATION_Y", 0);
    if (B("TRANSLATION_XY")) { const v = evalBinding(B("TRANSLATION_XY"), t), b0 = base("TRANSLATION_XY", { x: 0, y: 0 }); tx += v.x - b0.x; ty += v.y - b0.y; }
    if (B("ROTATION")) r = evalBinding(B("ROTATION"), t) - base("ROTATION", 0);
    if (B("SCALE_X")) sx *= ratio(evalBinding(B("SCALE_X"), t), base("SCALE_X", 1));
    if (B("SCALE_Y")) sy *= ratio(evalBinding(B("SCALE_Y"), t), base("SCALE_Y", 1));
    if (B("SCALE_XY")) { const v = evalBinding(B("SCALE_XY"), t), b0 = base("SCALE_XY", { x: 1, y: 1 }); sx *= ratio(v.x, b0.x); sy *= ratio(v.y, b0.y); }
    if (B("OPACITY")) o = evalBinding(B("OPACITY"), t);
    return { tx, ty, r, sx, sy, o };
  };
  const tracksFor = props => props.filter(B).flatMap(k => B(k).tracks.map(tr => keysOf(tr)).filter(k2 => k2.length));
  const end = Math.max(0, ...Object.keys(A).filter(B).flatMap(k => B(k).tracks.flatMap(tr => (tr.keyframes || []).map(f => f.timelinePosition))));
  const unknownEasing = new Set();
  for (const k of Object.keys(A).filter(B)) for (const tr of B(k).tracks) for (const f of tr.keyframes || []) { const e = easing(f.easing); if (e.unknown) unknownEasing.add(e.unknown); }
  for (const n of presetNotes) unsupported.push(n);
  // Two tracks on one property combine into a curve CSS can't draw between
  // keyframes, so that channel is sampled.
  const stacked = props => props.some(k => B(k) && B(k).tracks.length > 1);
  // Opacity as a fraction of the layer's own (presets scale it) or absolute
  // (hand-placed keyframes set it).
  const opacityScales = !!B("OPACITY") && B("OPACITY").tracks.every(tr => (tr.keyframeOperation || "SET") === "SCALE");
  return { at, unsupported, checks: [...new Set(checks)], odd: oddNotes, end, unknownEasing: [...unknownEasing], opacityScales,
           transform: tracksFor(TRANSFORM_PROPS), opacity: tracksFor(["OPACITY"]),
           sampleTransform: stacked(TRANSFORM_PROPS), sampleOpacity: stacked(["OPACITY"]) };
}

// Exact keyframes when every track of a channel shares its times and each
// segment's curve is one CSS can express; null means "sample it".
function exactFrames(tracks) {
  if (!tracks.length) return null;
  const times = tracks[0].map(k => k.timelinePosition);
  for (const keys of tracks) {
    if (keys.length !== times.length || keys.some((k, i) => Math.abs(k.timelinePosition - times[i]) > 1e-6)) return null;
  }
  const eases = [];
  for (let i = 0; i < times.length; i++) {
    const css = new Set(tracks.map(keys => easing(keys[i].easing).css));
    if (css.size !== 1 || css.has(null)) return null;
    eases.push([...css][0]);
  }
  return times.map((t, i) => ({ t, ease: eases[i] }));
}

// Sampled keyframes, thinned to the points a straight line between them can't
// reproduce within tolerance.
function sampledFrames(fn, start, end, tol, extraTimes) {
  const ts = new Set(extraTimes.concat([start, end]));
  for (let t = start; t < end; t += 1 / 60) ts.add(+t.toFixed(4));
  const pts = [...ts].filter(t => t >= start && t <= end).sort((a, b) => a - b).map(t => ({ t, v: fn(t) }));
  const kept = [pts[0]];
  let i = 0;
  while (i < pts.length - 1) {
    let j = i + 1;
    while (j + 1 < pts.length) {
      const a = pts[i], b = pts[j + 1];
      const ok = pts.slice(i + 1, j + 1).every(p => {
        const u = (p.t - a.t) / (b.t - a.t);
        return p.v.every((x, k) => Math.abs(x - (a.v[k] + (b.v[k] - a.v[k]) * u)) <= tol[k]);
      });
      if (!ok) break;
      j++;
    }
    kept.push(pts[j]);
    i = j;
  }
  return kept.map(p => ({ t: p.t, ease: "linear" }));
}

const n3 = x => +(+x).toFixed(3);
const dur = x => `${(+x).toFixed(2)}s`;   // a length as shown on screen
const pct = (t, D) => `${+(Math.min(1, Math.max(0, t / D)) * 100).toFixed(3)}%`;

function keyframesRule(name, frames, D, decl) {
  const out = [];
  frames = frames.map((f, i) => (i && f.t - frames[i - 1].t < D * 2e-5 ? Object.assign({}, f, { t: frames[i - 1].t + D * 2e-5 }) : f));
  if (frames[0].t > 0) out.push(`0%{${decl(frames[0].t)}}`);
  frames.forEach((f, i) => {
    const ease = i < frames.length - 1 && f.ease !== "linear" ? `;animation-timing-function:${f.ease}` : "";
    out.push(`${pct(f.t, D)}{${decl(f.t)}${ease}}`);
  });
  if (frames[frames.length - 1].t < D) out.push(`100%{${decl(frames[frames.length - 1].t)}}`);
  return `@keyframes ${name}{${out.join("")}}`;
}

// The matrix that takes coordinates in el's parent to the root SVG.
function parentMatrix(el) {
  let m = [1, 0, 0, 1, 0, 0];
  const chain = [];
  for (let p = el.parentNode; p && p.nodeType === 1 && p.nodeName.toLowerCase() !== "svg"; p = p.parentNode) chain.unshift(p);
  for (const p of chain) { const t = p.getAttribute("transform"); if (t) m = Converter.matMul(m, Converter.parseTransform(t)); }
  return m;
}

// Static SVG + keyframes → animated SVG. Returns the SVG and any motion that
// couldn't be carried across, in plain words.
function animateSvg(payload) {
  const doc = new DOMParser().parseFromString(payload.svg, "image/svg+xml");
  const root = doc.documentElement;
  const notes = (payload.skipped || []).slice();
  const layers = payload.anims.map(a => ({ a, m: layerMotion(a) }));
  const D = Math.max(0.05, ...layers.map(l => l.m.end));
  const css = [], anims = [];

  for (const { a, m } of layers) {
    if (m.unsupported.length) notes.push(`${a.name}: ${m.unsupported.join(", ")} animation can't be converted, so that part stays still.`);
    for (const o of m.odd) notes.push(`${a.name}: ${o} — compare the preview with Figma.`);
    if (m.unknownEasing.length) notes.push(`${a.name}: easing ${m.unknownEasing.join(", ")} isn't recognised — played as a plain ease.`);
    if (m.checks.length) notes.push(`${a.name}: ${m.checks.join(", ")} is converted from its Figma settings but hasn't been checked against Figma's playback yet — compare the preview with Figma.`);
    if (!m.transform.length && !m.opacity.length) continue;
    if (a.isBanner) { notes.push(`The banner frame itself is animated; only layers inside it are converted.`); continue; }
    const el = [...root.querySelectorAll("[id]")].find(e => e.id === a.token) ||
               [...root.querySelectorAll("[id]")].find(e => e.id.endsWith(a.token));
    if (!el) { notes.push(`${a.name}: not found in Figma's SVG export (it may be fully hidden or clipped), so it won't move.`); continue; }
    el.removeAttribute("id");
    const g = doc.createElementNS(SVGNS, "g");
    g.setAttribute("class", a.token);
    el.parentNode.insertBefore(g, el);
    g.appendChild(el);

    const list = [];
    if (m.transform.length) {
      // Centre in the wrapper's own coordinates, so rotate and scale pivot
      // where Figma pivots them.
      const c = a.center || { x: 0, y: 0 };
      const inv = Converter.matInvert(parentMatrix(g));
      const cx = inv[0] * c.x + inv[2] * c.y + inv[4], cy = inv[1] * c.x + inv[3] * c.y + inv[5];
      const decl = t => { const s = m.at(t); return `transform:translate(${n3(s.tx)}px,${n3(s.ty)}px) translate(${n3(cx)}px,${n3(cy)}px) rotate(${n3(-s.r)}deg) scale(${n3(s.sx)},${n3(s.sy)}) translate(${n3(-cx)}px,${n3(-cy)}px)`; };
      const frames = (!m.sampleTransform && exactFrames(m.transform)) ||
        sampledFrames(t => { const s = m.at(t); return [s.tx, s.ty, s.r, s.sx, s.sy]; }, 0, D, [0.05, 0.05, 0.05, 0.0005, 0.0005],
                      m.transform.flatMap(k => k.map(f => f.timelinePosition)));
      css.push(keyframesRule(`${a.token}t`, frames, D, decl));
      list.push(`${a.token}t`);
    }
    if (m.opacity.length) {
      // The layer's own opacity moves onto the wrapper, so hand-placed
      // keyframes can take it above where it rests (and up from 0).
      const own = parseFloat(el.getAttribute("opacity"));
      const rest = isNaN(own) ? 1 : own;
      el.removeAttribute("opacity");
      const op = t => (m.opacityScales ? rest * m.at(t).o : m.at(t).o);
      const decl = t => `opacity:${n3(Math.max(0, Math.min(1, op(t))))}`;
      const frames = (!m.sampleOpacity && exactFrames(m.opacity)) ||
        sampledFrames(t => [op(t)], 0, D, [0.002], m.opacity.flatMap(k => k.map(f => f.timelinePosition)));
      css.push(keyframesRule(`${a.token}o`, frames, D, decl));
      list.push(`${a.token}o`);
    }
    // One play, holding the end frame — the display spec's preferred shape.
    css.push(`.${a.token}{transform-origin:0 0;animation:${list.map(n => `${n} ${n3(D)}s linear 0s 1 both`).join(",")}}`);
    anims.push(a.name);
  }

  // Figma writes every layer's name as an id; keep only ids something points at.
  const text = new XMLSerializer().serializeToString(root);
  const used = new Set();
  for (const mm of text.matchAll(/url\(#([^)]+)\)|href="#([^"]+)"/g)) used.add(mm[1] || mm[2]);
  for (const e of root.querySelectorAll("[id]")) if (!used.has(e.id)) e.removeAttribute("id");

  if (css.length) {
    const style = doc.createElementNS(SVGNS, "style");
    style.textContent = css.join("\n");
    root.insertBefore(style, root.firstChild);
  }
  return { svg: new XMLSerializer().serializeToString(root), notes, duration: D, animatedLayers: anims };
}

const out = document.getElementById("out");

    : others === null ? "Counting the other animation on this page…"

}

});

// What the selection keeps and what goes, with its own confirm. Nothing is
// removed until Confirm, and with no animation in the selection the person
// has to acknowledge that everything else on the page goes.
function renderClearReview(msg) {
  result.innerHTML = "";
  const card = el("div", "card");
  card.id = "review";
  card.appendChild(el("b", null, "Review: remove animation from everything except your selection"));

  card.appendChild(el("div", "total", msg.keep.length
    ? `Keeping ${msg.keep.length} animated layer${msg.keep.length === 1 ? "" : "s"} in ${msg.selection.length === 1 ? `“${msg.selection[0]}”` : `${msg.selection.length} selected layers`}:`

  for (const k of msg.keep) {

  }

  card.appendChild(el("div", "total", `Removing animation from ${msg.removeCount.toLocaleString()} layer${msg.removeCount === 1 ? "" : "s"}:`));

    card.appendChild(el("div", "note", `${msg.inherited.toLocaleString()} more animated layer${msg.inherited === 1 ? "" : "s"} belong to components: inside an instance (its animation comes from the main component) or part of a main component (clearing it would clear every instance). They're left alone; edit the main component by hand if needed.`));
  if (msg.names.length)
    card.appendChild(el("div", "where", msg.names.slice(0, 8).map(n => `${n.name} ×${n.count}`).join(", ") +
      (msg.names.length > 8 ? `, and ${msg.names.length - 8} other names` : "")));
  if (msg.groups.length) {
    const d = el("details");
    d.appendChild(el("summary", "muted", `Across ${msg.groups.length} top-level frame${msg.groups.length === 1 ? "" : "s"}`));
    for (const g of msg.groups) {

      row.appendChild(a);
      row.appendChild(el("div", "where", `${g.name}: ${g.count}`));
      d.appendChild(row);
    }
    card.appendChild(d);
  }

  const btns = el("div", "btns");
  btns.style.marginTop = "10px";
  const ok = el("button", "danger", `Remove from ${msg.removeCount.toLocaleString()} layer${msg.removeCount === 1 ? "" : "s"}`);
  const cancel = el("button", "ghost", "Cancel");
  ok.disabled = !msg.removeCount;

  if (!msg.keep.length && msg.removeCount) {
    card.appendChild(el("div", "err", "Your selection has no animation, so this removes every animation on the page. Select the animated banner you want to keep instead, unless that's really what you mean."));
    const lab = el("label");
    lab.style.display = "flex"; lab.style.gap = "6px"; lab.style.marginTop = "6px";
    const cb = el("input"); cb.type = "checkbox";
    lab.appendChild(cb);
    lab.appendChild(el("span", null, "I understand — remove all animation on this page"));
    card.appendChild(lab);
    ok.disabled = true;
    cb.addEventListener("change", () => { ok.disabled = !cb.checked; });
  }
  ok.addEventListener("click", () => {
    ok.disabled = true; cancel.disabled = true;
    ok.textContent = "Removing…";
    parent.postMessage({ pluginMessage: { type: "clear", signature: msg.signature } }, "*");
  });
  cancel.addEventListener("click", () => { result.innerHTML = ""; });
  btns.appendChild(ok); btns.appendChild(cancel);
  card.appendChild(btns);
  card.appendChild(el("div", "muted", "Everything removed is backed up first as a restore point."));
  result.appendChild(card);
  card.scrollIntoView({ block: "start" });
}

const stop = document.getElementById("stop");

// The footer's Copy and Remove act on the plan on screen, so they step aside
// while a run is going, while browsing restore points, and while a review card
// has its own confirm button — one obvious next click at a time.
let runningNow = false;
function syncFooter() {
  const away = runningNow || view === "history" || !!document.getElementById("review");
  go.classList.toggle("hidden", away);
  clear.classList.toggle("hidden", away || currentMode === "export");
  document.querySelectorAll(".modes button").forEach(b => { b.disabled = runningNow || building || view === "history"; });
}
// Results and reviews sit above the plan; bring a new one into view. A result
// stays until dismissed or the next run, so it gets a close button (a review
// has its own Cancel).
new MutationObserver(() => {
  syncFooter();
  const card = result.firstElementChild;
  if (!card) return;
  if (card.id !== "review" && !card.querySelector(".dismiss")) {
    const x = el("a", "dismiss", "✕");
    x.title = "Dismiss";
    x.addEventListener("click", () => { result.innerHTML = ""; });
    card.insertBefore(x, card.firstChild);
  }
  card.scrollIntoView({ block: "nearest" });
}).observe(result, { childList: true });
// Answer every export the panel is still waiting for, so a build can never
// hang on a reply that won't come.
function releaseWaiting(reason) {
  for (const [id, res] of waiting) { waiting.delete(id); res({ id, error: reason }); }
}
stop.addEventListener("click", () => {
  uiStop = true;
  releaseWaiting("Stopped before this banner finished.");
  stop.disabled = true;
  stop.textContent = "Stopping…";
  parent.postMessage({ pluginMessage: { type: "stop" } }, "*");
});

// ---- restore points --------------------------------------------------------
// The browser takes over the main area. Previews that arrive meanwhile are kept
// and shown again on the way back.
let points = [], historyInfo = { page: "", error: "" }, view = "plan", stashedPlan = null;
const browse = document.getElementById("browse");
const fmtWhen = at => {
  const t = new Date(at), day = d => new Date(d).toDateString();
  const date = day(t) === day(Date.now()) ? "today" : day(t) === day(Date.now() - 864e5) ? "yesterday" : t.toLocaleDateString();
  return `${date} ${t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
};

function historyLabel() {
  const text = document.getElementById("restoreText");
  browse.classList.toggle("hidden", !points.length);
  if (historyInfo.error) { text.textContent = `Couldn't read restore points: ${historyInfo.error}`; return; }
  if (!points.length) { text.textContent = "Every run saves a restore point first, so it can be undone."; return; }
  text.textContent = `${points.length} restore point${points.length === 1 ? "" : "s"} on this page, latest ${fmtWhen(points[0].at)} ·`;
}
// The plan on screen is set aside, not thrown away — ticks and built export
// banners come back with it — and the footer's buttons, which act on that
// plan, are hidden meanwhile.
let stashedDom = null;
browse.addEventListener("click", () => {
  // Mid-export the rows being updated would be set aside; wait for it.
  if (view === "history" || building) return;
  view = "history";
  stashedDom = document.createDocumentFragment();
  while (out.firstChild) stashedDom.appendChild(out.firstChild);
  renderHistory();
  syncFooter();
});

function leaveHistory() {
  view = "plan";
  out.innerHTML = "";
  result.innerHTML = "";
  syncFooter();
  // A newer plan arrived while browsing (a run, or the selection changed).
  if (stashedPlan) { render(stashedPlan); stashedPlan = null; }
  else if (stashedDom) { out.appendChild(stashedDom); count(); }
  else parent.postMessage({ pluginMessage: { type: "scan" } }, "*");
  stashedDom = null;
}

function renderHistory(keepResult) {
  out.innerHTML = "";
  if (!keepResult) result.innerHTML = "";
  const back = el("a", null, "← Back");
  back.style.cssText = "color:var(--figma-color-text-brand);cursor:pointer;display:inline-block;margin-top:10px";
  back.addEventListener("click", leaveHistory);
  out.appendChild(back);
  out.appendChild(el("div", "muted", "Every run that changed animation, newest first. Going back to before one puts every layer it — or anything after it — changed back to how it was before it ran. Going back is a restore point too, so it can be undone."));
  if (!points.length) out.appendChild(el("div", "card muted", "No restore points on this page."));
  for (const [i, p] of points.entries()) {
    const card = el("div", "card");
    const head = el("div");
    head.appendChild(el("b", null, p.label));
    card.appendChild(head);
    const when = fmtWhen(p.at);
    card.appendChild(el("div", "where", `${when.charAt(0).toUpperCase()}${when.slice(1)} · ${p.count.toLocaleString()} layer${p.count === 1 ? "" : "s"}` +
      (p.versionSaved ? " · Figma version saved" : "") + (p.legacy ? " · from an earlier version of this plugin" : "")));
    if (i > 0) card.appendChild(el("div", "where", `${i} newer restore point${i === 1 ? "" : "s"} above — going back here undoes those too, for the layers they share.`));
    const btns = el("div", "btns");
    btns.style.marginTop = "8px";
    const go2 = el("button", "ghost", "Go back to before this…");

    const show = el("button", "ghost", "Show layers");
    show.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "showPoint", id: p.id } }, "*"));
    const del = el("button", "ghost", "Delete");
    let armed = null;
    del.addEventListener("click", () => {
      if (!armed) {

      parent.postMessage({ pluginMessage: { type: "deletePoint", id: p.id } }, "*");
    });
    btns.appendChild(go2); btns.appendChild(show); btns.appendChild(del);
    card.appendChild(btns);
    out.appendChild(card);
  }
}

// Layer names and copy come from the file, so build with textContent only.
function el(tag, cls, text) {

}

// Paths all start with the same long board name; the end is what tells

}

function count() {
  clearTimeout(goArmed); goArmed = null;
  if (currentMode === "export") return exportButton();
  go.classList.remove("danger");
  let n = 0;
  out.querySelectorAll("input.t:checked").forEach(c => { n += Number(c.dataset.n || 1); });

function render(msg) {
  out.innerHTML = "";
  if (msg.mode === "export" && "auto" in msg) exportAllOn = !!msg.auto;
  if (msg.error) {
    const card = el("div", "card muted", msg.error);
    if (msg.mode === "export") card.appendChild(exportAllToggle());
    out.appendChild(card); entries = []; count(); return;
  }
  if (msg.mode === "layout") return renderLayout(msg);
  if (msg.mode === "suite") return renderSuite(msg);
  if (msg.mode === "export") return renderExport(msg);
  entries = msg.entries;

  for (const e of entries) {
    const card = el("div", "card");
    const head = el("div");
    head.appendChild(el("b", null, e.name));
    head.appendChild(el("span", "muted", " — matched by " + e.label));
    card.appendChild(head);

    const ul = el("ul", "anim");
    for (const line of e.lines) ul.appendChild(el("li", null, line));
    card.appendChild(ul);
    if (e.kind === "name")
      card.appendChild(el("div", "warn", "No copy, image or component to match on, so this falls back to the layer name. Check the list."));
    if (e.warn) card.appendChild(el("div", "warn", e.warn));
    if (e.note) { card.appendChild(el("div", "note", e.note)); out.appendChild(card); continue; }
    if (e.blocked) {
      card.appendChild(el("div", "err", e.blocked));
      card.appendChild(el("div", "muted", `${e.matches.length} matching layer${e.matches.length === 1 ? "" : "s"} will be skipped.`));
      out.appendChild(card);
      continue;
    }

    const shown = e.matches.filter(m => !m.hidden).length;
    const hidden = e.matches.length - shown;
    const det = el("details");
    const sum = el("summary");
    const all = el("input"); all.type = "checkbox"; all.checked = shown > 0;
    all.addEventListener("click", ev => ev.stopPropagation());
    all.addEventListener("change", () => {
      det.querySelectorAll("input.t").forEach(c => { c.checked = all.checked; });
      count();
    });
    sum.appendChild(all);
    sum.appendChild(document.createTextNode(` ${e.matches.length} matching layer${e.matches.length === 1 ? "" : "s"}` +
      (hidden ? ` (${hidden} hidden, left unticked)` : "")));
    det.appendChild(sum);

    for (const m of e.matches) {
      const row = el("div", "row");
      const cb = el("input", "t"); cb.type = "checkbox"; cb.checked = !m.hidden;
      cb.dataset.src = e.id; cb.dataset.id = m.id;
      cb.addEventListener("change", count);
      const a = el("a", null, m.name);
      a.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "focus", id: m.id } }, "*"));
      const txt = el("div");
      txt.appendChild(a);
      txt.appendChild(el("div", "where", m.where + (m.hidden ? " · hidden" : "")));
      if (m.via) txt.appendChild(el("div", "where", m.via));
      row.appendChild(cb); row.appendChild(txt);
      det.appendChild(row);
    }
    if (e.locked.length) {
      const lk = el("details");
      lk.appendChild(el("summary", "warn", `${e.locked.length} match${e.locked.length === 1 ? "" : "es"} inside components can't be copied — Figma doesn't let plugins animate part of a component. Animate the component itself.`));
      for (const w of e.locked) lk.appendChild(el("div", "where", w));
      card.appendChild(lk);
    }
    if (!e.matches.length) card.appendChild(el("div", "muted", "No other layer on this page can take this animation."));
    else card.appendChild(det);
    out.appendChild(card);
  }
  count();
}

function renderSuite(msg) {
  const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
  const size = msg.hero.size;
  const total = msg.steps.reduce((n, s) => n + s.layers, 0);
  const copyIssues = msg.copyIssues || [];
  // A banner whose headline is one of the differing wordings is already
  // explained under "Wording differs", so it isn't listed a second time.
  // (The plan clips long copy to 60 characters with "…", so compare the start.)
  const wordings = copyIssues.flat().map(v => v.copy);
  const isVariant = c => {
    c = String(c);
    if (!c.trim()) return false;
    if (!c.endsWith("…")) return wordings.includes(c);
    const head = c.slice(0, -1);
    return wordings.some(w => w.startsWith(head));
  };
  const explained = msg.partial.filter(it => it.texts.every(t => isVariant(t.copy)));
  const partial = msg.partial.filter(it => !explained.includes(it));
  const attention = msg.notReached.length + partial.length + msg.layoutBanners.length;

  // 1. The outcome, in one line.
  const sum = el("div", "card");
  sum.appendChild(el("div", "total", `Animates ${msg.reachedTotal} of ${plural(msg.bannerTotal, "banner")}`));
  const flags = [copyIssues.length ? `${plural(copyIssues.length, "message")} worded differently between banners` : "",
                 attention ? `${plural(attention, "banner")} need${attention === 1 ? "s" : ""} a look` : ""].filter(Boolean);
  sum.appendChild(el("div", "muted", `${plural(total, "layer")} in total.` + (flags.length ? ` ${flags.join(", ")} — see below.` : "")));
  for (const b of msg.blocked) sum.appendChild(el("div", "err", b));
  out.appendChild(sum);

  // 2. What's being copied.
  const hero = el("div", "card");
  hero.appendChild(el("b", null, `Copying from ${msg.hero.name}`));
  const ul = el("ul", "anim");
  for (const s of msg.hero.sources) ul.appendChild(el("li", null, `${s.name}: ${s.lines.join("; ")}`));
  hero.appendChild(ul);
  out.appendChild(hero);

  // 3. The three steps, in plain words. Each can be switched off.
  const STEP = {
    1: ["Same message, every size",
        "Every banner showing the same headline, CTA, logo or picture as yours gets the same animation, at any size."],
    2: [`Same size, every message`,
        `The other ${size} banners get it in the same spots, whatever their headline says.`],
    3: ["Every message, every size",
        `Each of those ${size} banners then passes its animation on to the other sizes of its own message.`]
  };
  const steps = el("div", "card steps");
  for (const s of msg.steps) {
    const lab = el("label");
    const cb = el("input", "t"); cb.type = "checkbox";
    cb.checked = s.layers > 0; cb.disabled = !s.layers;
    cb.dataset.step = s.step; cb.dataset.n = s.layers;
    cb.addEventListener("change", count);
    const txt = el("div");
    txt.appendChild(el("b", null, `${s.step}. ${STEP[s.step][0]}`));
    txt.appendChild(el("div", "where", STEP[s.step][1]));
    txt.appendChild(el("div", "where", s.layers ? `${plural(s.layers, "layer")} in ${plural(s.banners, "banner")}` : "Nothing to do in this step."));
    lab.appendChild(cb); lab.appendChild(txt);
    steps.appendChild(lab);
  }
  out.appendChild(steps);

  // 4. Anything a person should check, each with why and what to do.
  if (attention || copyIssues.length) {
    const need = el("div", "card");
    need.appendChild(el("b", null, "Needs a look"));
    if (copyIssues.length) {
      const d = el("details");
      d.open = true;
      d.appendChild(el("summary", "err", `Wording differs between banners — ${copyIssues.length} message${copyIssues.length === 1 ? "" : "s"}`));
      d.appendChild(el("div", "muted", "The same message is worded slightly differently on different banners — usually a typo, or a copy edit that missed some sizes. Fix it in Figma so they match, then reselect your banner to plan again." +
        (explained.length ? ` Until then the headline stays still on ${plural(explained.length, "banner")} (their other layers still animate).` : "")));
      for (const issue of copyIssues) {
        const box = el("div");
        box.style.cssText = "border-left:2px solid var(--figma-color-border-danger, #e5484d);padding-left:8px;margin-top:8px";
        for (const v of issue) {
          const row = el("div", "row");
          const a = el("a", null, "Select");
          a.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "select", ids: v.ids } }, "*"));
          const txt = el("div");
          txt.appendChild(el("div", null, `“${v.copy}”`));
          txt.appendChild(el("div", "where", `${plural(v.count, "banner")} · ${v.sizes.join(", ")}`));
          row.appendChild(a); row.appendChild(txt);
          box.appendChild(row);
        }
        d.appendChild(box);
      }
      need.appendChild(d);
    }
    const list = (title, explain, items, describeItem) => {
      if (!items.length) return;
      const d = el("details");
      d.appendChild(el("summary", "warn", title));
      d.appendChild(el("div", "muted", explain));
      for (const it of items) {
        const row = el("div", "row");
        const a = el("a", null, "Show");
        a.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "focus", id: it.id } }, "*"));
        const txt = el("div");
        txt.appendChild(whereEl(it.where));
        const extra = describeItem && describeItem(it);
        if (extra) { const ex = el("div", null, extra); ex.style.whiteSpace = "pre-line"; txt.appendChild(ex); }
        row.appendChild(a); row.appendChild(txt);
        d.appendChild(row);
      }
      need.appendChild(d);
    };
    list(`${plural(msg.notReached.length, "banner")} won't be animated`,
      "Nothing in these matched your banner. Each one says why, layer by layer. Fix it in Figma, or animate one by hand.",
      msg.notReached, it => (it.why || []).join("\n"));
    if (partial.length) {
      // Usually many banners share one wording; say it once per wording.
      const groups = new Map();
      for (const it of partial) {
        const said = it.texts.map(t => t.near
          ? `Says: “${t.copy}”\nClosest animated headline: “${t.near}”`
          : `Says: “${t.copy}” — no animated headline is close`).join("\n");
        if (!groups.has(said)) groups.set(said, []);
        groups.get(said).push(it);
      }
      const d = el("details");
      d.appendChild(el("summary", "warn", `${plural(partial.length, "banner")}: the headline won't move`));
      d.appendChild(el("div", "muted", "Headlines are matched by their exact wording. These don't match any animated banner word for word, so their other layers animate but the headline stays still. Make the wording match, or animate one banner of that size and use Same layout."));
      for (const [said, items] of groups) {
        const box = el("div");
        box.style.cssText = "border-left:2px solid var(--figma-color-border);padding-left:8px;margin-top:8px";
        const t = el("div", null, said); t.style.whiteSpace = "pre-line";
        box.appendChild(t);
        for (const it of items) {
          const row = el("div", "row");
          const a = el("a", null, "Show");
          a.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "focus", id: it.id } }, "*"));
          row.appendChild(a); row.appendChild(whereEl(it.where));
          box.appendChild(row);
        }
        d.appendChild(box);
      }
      need.appendChild(d);
    }
    list(`${plural(msg.layoutBanners.length, `${size} banner`)}: some layers not found`,
      `These are laid out differently from your banner, so some of its animated layers had no counterpart.`,
      msg.layoutBanners, it => [it.missing.length ? `Not found: ${it.missing.join(", ")}` : "",
                                it.locked.length ? `Inside a component, which a plugin can't animate: ${it.locked.join(", ")}` : ""].filter(Boolean).join("\n"));
    out.appendChild(need);
  }

  // 5. Small print, and how matching works, folded away.
  const small = [];
  if (msg.hiddenSkipped) small.push(`${plural(msg.hiddenSkipped, "hidden layer")} left alone.`);
  if (msg.lockedCount) small.push(`${plural(msg.lockedCount, "layer")} inside components left alone — a plugin can't animate part of a component.`);
  if (msg.conflicts) small.push(`${plural(msg.conflicts, "layer")} matched two different animations; your banner's own won.`);
  const how = el("details");
  how.appendChild(el("summary", "muted", "How this works"));
  how.appendChild(el("div", "where",
    "Text is matched by exact wording, buttons and logos by component, images by the picture itself, and anything else by layer name. " +
    `Step 2 instead matches by position: the same layer in the same place in each ${size} banner. ` +
    "Every banner ends up with animation copied from one of your banner's layers, so it moves the way yours does. " +
    "A restore point and a Figma version are saved before anything changes."));
  const foot = el("div", "card");
  for (const line of small) foot.appendChild(el("div", "muted", line));
  foot.appendChild(how);
  out.appendChild(foot);
  count();
}

function renderLayout(msg) {
  for (const h of msg.heroes) {
    const card = el("div", "card");
    const head = el("div");
    head.appendChild(el("b", null, h.name));
    const sized = h.name.replace(/\s*[x×]\s*/, "×") === h.size;   // most banners are named by their size
    head.appendChild(el("span", "muted", ` — ${sized ? "" : `${h.size}, `}${h.sources.length} animated layer${h.sources.length === 1 ? "" : "s"}`));
    card.appendChild(head);
    const ul = el("ul", "anim");
    for (const s of h.sources) ul.appendChild(el("li", null, `${s.name}: ${s.lines.join("; ")}`));
    card.appendChild(ul);
    for (const b of h.blocked) card.appendChild(el("div", "err", b));
    if (!h.sources.length) {
      card.appendChild(el("div", "muted", "Nothing in this banner has animation that can be copied."));
      out.appendChild(card);
      continue;
    }
    if (!h.banners.length) {
      card.appendChild(el("div", "muted", `No other ${h.size} banner on this page.`));
      out.appendChild(card);
      continue;
    }

    const det = el("details");
    det.open = true;
    const sum = el("summary");
    const all = el("input"); all.type = "checkbox"; all.checked = true;
    all.addEventListener("click", ev => ev.stopPropagation());
    all.addEventListener("change", () => {
      det.querySelectorAll("input.t").forEach(c => { if (!c.disabled) c.checked = all.checked; });
      count();
    });
    sum.appendChild(all);
    const complete = h.banners.filter(b => !b.missing.length && !b.locked.length).length;
    sum.appendChild(document.createTextNode(` ${h.banners.length} other ${h.size} banner${h.banners.length === 1 ? "" : "s"}` +
      (complete < h.banners.length ? ` · ${h.banners.length - complete} only partly matched` : " · all fully matched")));
    det.appendChild(sum);

    for (const b of h.banners) {
      const row = el("div", "row");
      const cb = el("input", "t"); cb.type = "checkbox";
      cb.disabled = !b.pairs.length;
      cb.checked = b.pairs.length > 0 && !b.hidden;
      cb.dataset.pairs = JSON.stringify(b.pairs.map(p => [p.src, p.tgt]));
      cb.dataset.n = b.pairs.length;
      cb.addEventListener("change", count);
      const txt = el("div");
      const a = el("a", null, b.name);
      a.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "focus", id: b.id } }, "*"));
      txt.appendChild(a);
      // Where it sits, on the same line: the last part of the path is what
      // tells same-size banners apart.
      const at = el("span", "where", ` · ${String(b.where || "").split(" › ").pop()}${b.hidden ? " · hidden" : ""}`);
      at.title = b.where;
      txt.appendChild(at);
      // Only say what was found when something wasn't.
      const n = h.sources.length;
      if (b.pairs.length < n || b.missing.length || b.locked.length)
        txt.appendChild(el("div", "warn", `${b.pairs.length} of ${n} layers found` +
          (b.missing.length ? ` — no match for ${b.missing.join(", ")}` : "") +
          (b.locked.length ? ` — inside a component, can't animate: ${b.locked.join(", ")}` : "")));
      const guessed = b.pairs.filter(p => p.how !== "same layer");
      if (guessed.length)
        txt.appendChild(el("div", "where", guessed.map(p => `${p.srcName} → ${p.how}`).join("; ")));
      row.appendChild(cb); row.appendChild(txt);
      det.appendChild(row);
    }
    card.appendChild(det);
    out.appendChild(card);
  }
  count();
}

/* ============================================================ export mode ==== */
// Build each banner one at a time (Figma exports, this panel animates, checks
// and packages it with the web tool's own converter), then download them all
// as one zip. Blocked banners are left out of the zip, as on the web tool.
let exportPlan = [], built = new Map(), building = false, uiStop = false, previewId = null;
// Bumped whenever earlier builds stop counting (new settings, a new list), so a
// banner still building when that happens isn't kept.
let buildGen = 0, buildAgain = false, listPage = "", laterPlan = null, downloading = false;
// Animation must stop within 15s (IAB; Google rejects anything past 30s):
// 2 plays of a 3s timeline with an 8s hold on the end frame and a 1s fade
// between is exactly 15s, ending on the end frame.
let exportLoop = { plays: 2, pause: 8, fade: 1 };
const fixSizeFor = new Set();   // banners the person chose to export at their named size
const waiting = new Map();   // banner id → resolver for its "exported" message

// "Find every banner on this page" instead of using the selection. The plugin
// remembers it and tells the panel at start-up.
let exportAllOn = false;
function exportAllToggle() {
  const lab = el("label", "xopts");
  lab.style.cursor = "pointer";
  const cb = el("input"); cb.type = "checkbox"; cb.checked = exportAllOn; cb.id = "xall";
  cb.addEventListener("change", () => {
    exportAllOn = cb.checked;
    out.innerHTML = "";
    out.appendChild(el("div", "card muted", cb.checked ? "Looking for banners on this page…" : "Using your selection…"));
    parent.postMessage({ pluginMessage: { type: "exportAll", on: cb.checked } }, "*");
  });
  lab.appendChild(cb);
  lab.appendChild(document.createTextNode("Find every banner on this page (frames named by size, like 300x250)"));
  return lab;
}

const slug = s => String(s).replace(/×/g, "x").replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^[-.]+|[-.]+$/g, "") || "banner";

/* ------------------------------------------------------ delivery folders -- */
// Optional: the download laid out as a delivery. One folder per version,
// <prefix>_<code>, holding one of each size as <prefix>_<code>_<WxH>.zip with its
// backup .jpg beside it. The codes are saved in the Figma file, so whoever opens
// it exports the same layout.
let delivery = { on: false, prefix: "", versions: {} };
const SIZE = /^\d+\s*[x×X]\s*\d+$/;
const sizeKey = s => String(s).replace(/[×X]/g, "x").replace(/\s+/g, "");
// The size a banner exports at: the one its name promises (a frame a pixel or
// two off is exported at its named size), else its own.
const bannerSize = b => SIZE.test(String(b.name || "").trim()) ? sizeKey(String(b.name).trim()) : `${b.w}x${b.h}`;
// The version a banner belongs to, from the plugin (the nearest frame above it
// not named by a size). Without one, its path stands in.
function versionOf(b) {
  if (b.versionId) return { id: b.versionId, name: b.versionName || "" };
  const parts = String(b.where || "").split(" › ").filter(Boolean);
  while (parts.length > 1 && SIZE.test(parts[parts.length - 1].trim())) parts.pop();
  const k = parts.join(" › ") || "(this page)";
  return { id: k, name: parts[parts.length - 1] || k };
}
const codeOf = id => { const c = ((delivery.versions || {})[id] || {}).code; return c ? slug(c) : ""; };
const prefixed = s => (delivery.prefix ? slug(delivery.prefix) + "_" : "") + s;
// The date the person sees, not UTC's.
const localDate = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function useDelivery(d) {
  if (d && typeof d === "object") delivery = { on: !!d.on, prefix: String(d.prefix || ""), versions: Object.assign({}, d.versions || {}) };
  // Changes typed in the last moment haven't reached the file yet: keep them.
  for (const { patch: p } of pendingSaves.values()) {
    if ("on" in p) delivery.on = !!p.on;
    if ("prefix" in p) delivery.prefix = String(p.prefix || "");
    if (p.version) delivery.versions[p.version.id] = { code: p.version.code, name: p.version.name };
  }
}

// Each change goes to the file on its own (a code, the prefix, on/off), merged
// there into what the file holds, so two people editing don't overwrite each
// other. Pending changes are sent if the plugin closes.
const pendingSaves = new Map();
function saveDelivery(key, patch) {
  const old = pendingSaves.get(key);
  if (old) clearTimeout(old.timer);
  pendingSaves.set(key, { patch, timer: setTimeout(() => flushSave(key), 300) });
}
function flushSave(key) {
  const p = pendingSaves.get(key);
  if (!p) return;
  clearTimeout(p.timer); pendingSaves.delete(key);
  parent.postMessage({ pluginMessage: { type: "saveDelivery", patch: p.patch } }, "*");
}
window.addEventListener("pagehide", () => [...pendingSaves.keys()].forEach(flushSave));
window.addEventListener("beforeunload", () => [...pendingSaves.keys()].forEach(flushSave));

// What the setup makes from a banner list: per file (code + size, matched without
// regard to case, since Finder and Windows don't tell them apart), the banners
// that could fill it.
function deliveryPlan(banners) {
  const versions = new Map();
  for (const b of banners) {
    const v = versionOf(b);
    if (!versions.has(v.id)) versions.set(v.id, { name: v.name, items: [] });
    versions.get(v.id).items.push(b);
  }
  const files = new Map(), spelling = new Map(), uncoded = [];
  for (const [id, v] of versions) {
    let code = codeOf(id);
    if (!code) { uncoded.push(...v.items); continue; }
    code = spelling.get(code.toLowerCase()) || (spelling.set(code.toLowerCase(), code), code);
    for (const b of v.items) {
      const size = bannerSize(b), key = `${code}|${size}`.toLowerCase();
      if (!files.has(key)) files.set(key, { code, size, candidates: [] });
      files.get(key).candidates.push({ b, version: id });
    }
  }
  return { versions, files: [...files.values()], uncoded };
}
// Which banner fills each file: the first ticked one that was built and passed.
function deliveryPicks(ticked) {
  const plan = deliveryPlan(exportPlan);
  const out = [], left = [], placed = new Set();
  for (const f of plan.files) {
    const usable = f.candidates.filter(c => ticked.has(c.b.id) && built.has(c.b.id) && built.get(c.b.id).ok);
    const stem = prefixed(`${f.code}_${f.size}`);
    if (!usable.length) {
      const c = f.candidates.find(c => ticked.has(c.b.id));
      left.push(`${stem} (${!c ? "not ticked" : !built.has(c.b.id) ? "not built" : "not to spec"})`);
      continue;
    }
    const versionsUsed = new Set(usable.map(c => c.version));
    out.push({ stem, folder: prefixed(f.code), size: f.size, id: usable[0].b.id,
               clash: versionsUsed.size > 1, twice: usable.length > 1 });
    placed.add(usable[0].b.id);
  }
  return { plan, out, left, placed };
}
