  body.appendChild(vlist);
  const check = el("div", "muted");
  check.style.cssText = "font-size:11px;display:flex;flex-direction:column;gap:3px";
  body.appendChild(check);

  const plan = deliveryPlan(exportPlan);
  const sameName = new Map();
  for (const [, v] of plan.versions) sameName.set(v.name, (sameName.get(v.name) || 0) + 1);
  const seen = new Map();
  for (const [id, v] of plan.versions) {
    const row = el("div");
    row.style.cssText = "display:flex;gap:6px;align-items:center;padding:3px 0;border-top:1px solid var(--figma-color-border,#e5e5e5)";
    let label = v.name || "(this page)";
    if (sameName.get(v.name) > 1) { const k = (seen.get(v.name) || 0) + 1; seen.set(v.name, k); label += ` (${k} of ${sameName.get(v.name)})`; }
    const name = el("span", null, label);
    name.title = String((v.items[0] || {}).where || label);
    name.style.cssText = "min-width:110px;font-weight:600";
    row.appendChild(name);
    const code = el("input"); code.type = "text"; code.value = (delivery.versions[id] || {}).code || ""; code.placeholder = "code"; code.style.cssText = field + ";width:52px";
    code.addEventListener("input", () => {
      delivery.versions[id] = { code: code.value.trim(), name: v.name };
      saveDelivery(`v:${id}`, { version: { id, code: code.value.trim(), name: v.name } });
      exportButton();
    });
    row.appendChild(code);
    row.appendChild(el("span", "muted", `${v.items.length} size${v.items.length === 1 ? "" : "s"}`));
    vlist.appendChild(row);
  }
  on.addEventListener("change", () => { delivery.on = on.checked; saveDelivery("on", { on: on.checked }); deliverySummary(); exportButton(); });
  pref.addEventListener("input", () => { delivery.prefix = pref.value.trim(); saveDelivery("prefix", { prefix: pref.value.trim() }); exportButton(); });
  box._parts = { sum, check, example };
  box.open = delivery.on && !Object.values(delivery.versions).some(v => v && v.code);
  return box;
}
// The panel's one-line summary and its notes, from the codes and the ticks.
function deliverySummary() {
  const box = document.getElementById("xdelivery");
  if (!box || !box._parts) return;
  const { sum, check, example } = box._parts;
  example.textContent = `→ ${prefixed("1B")}/${prefixed("1B_300x250")}.zip`;
  const ticked = new Set([...out.querySelectorAll("input.xb:checked")].map(c => c.dataset.id));
  const plan = deliveryPlan(exportPlan);
  const wanted = plan.files.filter(f => f.candidates.some(c => ticked.has(c.b.id)));
  const folders = new Set(wanted.map(f => f.code.toLowerCase())).size;
  sum.textContent = delivery.on
    ? `Delivery folders: ${folders} folder${folders === 1 ? "" : "s"}, ${wanted.length} banner${wanted.length === 1 ? "" : "s"}`
    : "Delivery folders: off — one flat zip";
  check.innerHTML = "";
  if (!delivery.on) return;
  if (!plan.files.length) { check.appendChild(el("div", "warn", "Give at least one version a code.")); return; }
  check.appendChild(el("div", null, `Makes ${wanted.length} banner${wanted.length === 1 ? "" : "s"} in ${folders} folder${folders === 1 ? "" : "s"}, each with its backup .jpg.`));
  const clash = plan.files.filter(f => new Set(f.candidates.filter(c => ticked.has(c.b.id)).map(c => c.version)).size > 1);
  if (clash.length) check.appendChild(el("div", "warn", `Two versions share a code, so these would get the same file name (the first is used): ${clash.map(f => prefixed(`${f.code}_${f.size}`)).join(", ")}.`));
  const twice = plan.files.filter(f => f.candidates.filter(c => ticked.has(c.b.id)).length > 1 && !clash.includes(f));
  if (twice.length) check.appendChild(el("div", "warn", `More than one banner of the same size in a version (the first that passes is used): ${twice.map(f => prefixed(`${f.code}_${f.size}`)).join(", ")}.`));
  const unticked = plan.files.filter(f => !f.candidates.some(c => ticked.has(c.b.id)));
  if (unticked.length) check.appendChild(el("div", null, `Not ticked, so left out: ${unticked.map(f => prefixed(`${f.code}_${f.size}`)).join(", ")}.`));
  const uncoded = plan.uncoded.filter(b => ticked.has(b.id));
  if (uncoded.length) check.appendChild(el("div", null, `${uncoded.length} ticked banner${uncoded.length === 1 ? " is" : "s are"} in a version with no code, so left out.`));
}

function exportButton() {
  out.querySelectorAll("input.xg").forEach(g => {
    const rows = [...out.querySelectorAll(`input.xb[data-group="${g.dataset.group}"]`)];
    const on = rows.filter(c => c.checked).length;
    g.checked = on > 0 && on === rows.length;
    g.indeterminate = on > 0 && on < rows.length;
  });
  const pa = document.getElementById("previewAll");
  if (pa) { pa.classList.toggle("hidden", !built.size); pa.textContent = `Preview all ${built.size}`; }
  updateSummary();
  deliverySummary();
  const picked = [...out.querySelectorAll("input.xb:checked")];
  const boxes = out.querySelectorAll("input.xb"), pick = document.getElementById("xpick");
  if (pick) pick.textContent = boxes.length && picked.length === boxes.length ? "Select none" : "Select all";
  const ready = picked.filter(c => (built.get(c.dataset.id) || {}).ok).length;
  go.classList.remove("danger");
  if (building || downloading) { go.disabled = true; return; }
  // Once every ticked banner has been built, the button downloads whatever
  // passed — one failure mustn't hold back the rest. Ticking another unbuilt
  // banner switches it back to building.
  if (picked.length && picked.every(c => built.has(c.dataset.id))) {
    // In the delivery layout, what goes in is what the codes place.
    const placed = delivery.on ? deliveryPicks(new Set(picked.map(c => c.dataset.id))).out.length : ready;
    go.disabled = !placed;
    go.textContent = placed ? `Download ${placed} banner${placed === 1 ? "" : "s"} (.zip)`
      : ready ? "Give a version a code to download" : "Nothing passed — see why below";
    go.dataset.action = "download";
  } else {
    const todo = picked.filter(c => !built.has(c.dataset.id)).length;
    go.disabled = !picked.length;
    go.textContent = picked.length ? `Build and check ${todo || picked.length} banner${(todo || picked.length) === 1 ? "" : "s"}` : "Build and check";
    go.dataset.action = "build";
  }
}

// Banners grouped by the frame they sit in, each group kept together, and a
// heading for each: the shortest end of its path that no other group shares,
// numbered where frames share a name ("Version A (2 of 5)").
function exportGroups(banners) {
  const groups = new Map();
  for (const b of banners) {
    const k = b.group || b.where || "";
    if (!groups.has(k)) groups.set(k, { where: b.where || "", items: [] });
    groups.get(k).items.push(b);
  }
  const list = [...groups.values()];
  const paths = [...new Set(list.map(g => g.where))].map(w => w.split(" › "));
  const tail = (parts, k) => parts.slice(-k).join(" › ");
  const label = w => {
    const parts = w.split(" › ");
    for (let k = 1; k < parts.length; k++)
      if (paths.every(p => p.join(" › ") === w || tail(p, k) !== tail(parts, k))) return tail(parts, k);
    return w;
  };
  const seen = new Map();
  for (const g of list) {
    g.label = g.where ? label(g.where) : "This page";
    const same = list.filter(x => x.where === g.where).length;
    if (same > 1) { const i = (seen.get(g.where) || 0) + 1; seen.set(g.where, i); g.label += ` (${i} of ${same})`; }
  }
  return list;
}

function renderExport(msg) {
  if (document.getElementById("gallery")) closeGallery();
  useDelivery(msg.delivery);   // the setup as the file holds it now
  // A new selection is a new export: earlier builds may be out of date.
  const groups = exportGroups(msg.banners);
  exportPlan = groups.flatMap(g => g.items);
  built = new Map();
  buildGen++;
  listPage = msg.page || "";
  fixSizeFor.clear();
  previewId = null;
  out.innerHTML = "";
  const card = el("div", "card");

  // Count, live summary, and the gallery — everything about the batch on one line.
  const head = el("div", "xhead");
  head.appendChild(el("b", null, `${exportPlan.length} banner${exportPlan.length === 1 ? "" : "s"}`));
  const sum = el("span", "sum"); sum.id = "xsum";
  head.appendChild(sum);
  head.appendChild(el("span", "sp"));
  const all = el("a", "hidden", "Preview all"); all.id = "previewAll";
  all.addEventListener("click", () => openGallery());
  head.appendChild(all);
  const pick = el("a", null, "Select all");
  pick.id = "xpick";
  pick.addEventListener("click", () => {
    if (building) return;
    const boxes = [...out.querySelectorAll("input.xb")], on = !boxes.every(c => c.checked);
    boxes.forEach(c => { c.checked = on; });
    exportButton();
  });
  head.appendChild(pick);
  card.appendChild(head);
  // Said where the output is made: the checks help, they don't sign anything off.
  const dev = el("div", "muted", "In development: check every banner yourself before delivering it (playback, end frame, click, sizes, backup).");
  dev.style.cssText = "font-size:11px;margin:2px 0 4px;color:var(--figma-color-text-warning)";
  card.appendChild(dev);
  card.appendChild(exportAllToggle());
  // Copies an export left behind when it was cut short (Figma closed mid-build).
  if (msg.leftovers && msg.leftovers.length) {
    const w = el("div", "warn", `${msg.leftovers.length} cop${msg.leftovers.length === 1 ? "y" : "ies"} left on this page by an export that was cut short (Figma closed mid-build). They're not listed here; delete them in Figma. `);
    const a = el("a", null, "Select them");
    a.style.cssText = "color:var(--figma-color-text-brand);cursor:pointer";
    a.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "select", ids: msg.leftovers } }, "*"));
    w.appendChild(a);
    card.appendChild(w);
  }
  if (msg.auto) {
    const n = el("div", "muted", "Only frames named by their size are found. To export one named otherwise, untick this and select it." +
      (msg.offSize ? ` ${msg.offSize} frame${msg.offSize === 1 ? " is" : "s are"} named by a size more than 2px off it (a scaled mockup, say) and left out.` : ""));
    n.style.cssText = "font-size:11px;margin-top:4px";
    card.appendChild(n);
  }

  // Plays and a pause between them — the same option as the web tool. The
  // banners are packaged with it, so changing it means building again.
  const opts = el("div", "xopts");
  const plays = el("select");
  for (const [v, t] of [["1", "Plays once"], ["2", "Plays twice"], ["3", "Plays 3 times"], ["forever", "Loops forever"]]) { const o = el("option", null, t); o.value = v; plays.appendChild(o); }
  plays.value = exportLoop.plays === Infinity ? "forever" : String(exportLoop.plays);
  const pause = el("input");
  pause.type = "number"; pause.min = 0; pause.max = 10; pause.step = 0.5; pause.value = exportLoop.pause; pause.style.width = "48px";
  const pauseLab = el("label");
  pauseLab.style.cssText = "display:flex;gap:4px;align-items:center;margin:0";
  pauseLab.appendChild(document.createTextNode("with a"));
  pauseLab.appendChild(pause);
  pauseLab.appendChild(el("span", null, "s pause on the end frame between plays"));
  // Fade the animated layers out before each replay (never a background
  // image), so every replay starts clean without fading them out in Figma.
  const fadeLab = el("label");
  fadeLab.style.cssText = "display:flex;gap:4px;align-items:center;margin:0";
  const fadeOn = el("input"); fadeOn.type = "checkbox"; fadeOn.checked = exportLoop.fade > 0; fadeOn.style.margin = "0";
  const fadeSecs = el("input");
  fadeSecs.type = "number"; fadeSecs.min = 0.1; fadeSecs.max = 3; fadeSecs.step = 0.1; fadeSecs.value = exportLoop.fade || 0.5; fadeSecs.style.width = "44px";
  fadeLab.appendChild(fadeOn);
  fadeLab.appendChild(el("span", null, "Fade animated layers out before each replay, over"));
  fadeLab.appendChild(fadeSecs);
  fadeLab.appendChild(el("span", null, "s"));
  // A pause or fade only means something between plays.
  const sync = () => {
    pause.disabled = plays.value === "1";
    pauseLab.classList.toggle("hidden", pause.disabled);
    fadeLab.classList.toggle("hidden", pause.disabled);
  };
  const changed = () => {
    exportLoop = { plays: plays.value === "forever" ? Infinity : Number(plays.value), pause: Math.max(0, parseFloat(pause.value) || 0),
                   fade: fadeOn.checked ? Math.max(0.1, parseFloat(fadeSecs.value) || 0.5) : 0 };
    sync();
    buildGen++;
    if (built.size) {
      built = new Map();
      previewId = null;
      out.querySelectorAll("input.xb[data-built]").forEach(c => { delete c.dataset.built; setStatus(c.dataset.id, "Build again"); });
      const pv = document.getElementById("xpreview"); if (pv) pv.classList.add("hidden");
    }
    exportButton();
  };
  plays.addEventListener("change", changed);
  pause.addEventListener("change", changed);
  fadeOn.addEventListener("change", changed);
  fadeSecs.addEventListener("change", changed);
  opts.appendChild(plays);
  opts.appendChild(pauseLab);
  opts.appendChild(fadeLab);
  sync();
  card.appendChild(opts);
  card.appendChild(deliveryPanel());

  // Rows, grouped under where they sit. Every group usually shares the same
  // long board name, so the heading leaves that off and shows what differs.
  const list = el("div");
  list.id = "xlist";
  for (const [gi, g] of groups.entries()) {
    // Tick or untick a whole group at once — e.g. a board of mockups.
    const gh = el("label", "xgroup");
    gh.title = g.where;
    const gcb = el("input", "xg"); gcb.type = "checkbox"; gcb.dataset.group = gi;
    gcb.style.margin = "0 6px 0 0";
    gcb.addEventListener("change", () => {
      out.querySelectorAll(`input.xb[data-group="${gcb.dataset.group}"]`).forEach(c => { c.checked = gcb.checked; });
      exportButton();
    });
    gh.appendChild(gcb);
    gh.appendChild(el("span", null, g.label));
    list.appendChild(gh);
    // Two banners the same size at exactly the same spot in the same frame are
    // almost always a duplicate sitting on top of the original.
    const spot = b => `${b.w}x${b.h}@${b.x},${b.y}`;
    const spots = new Map();
    for (const b of g.items) if (b.x !== undefined) spots.set(spot(b), (spots.get(spot(b)) || 0) + 1);
    for (const b of g.items) {
      const row = el("div", "xrow");
      const cb = el("input", "xb"); cb.type = "checkbox"; cb.checked = b.animated > 0 && !b.hidden; cb.dataset.id = b.id; cb.dataset.group = gi;
      cb.addEventListener("change", exportButton);
      const label = el("div");
      const name = el("span", "name", `${b.w}×${b.h}`);
      name.title = "Preview this banner";
      name.addEventListener("click", () => showBanner(b.id));
      label.appendChild(name);
      if (!/^\d+\s*[x×X]\s*\d+$/.test(b.name)) label.appendChild(el("span", "sub", b.name));
      if (!b.animated) label.appendChild(el("span", "sub", "· no animation"));
      if (b.hidden) label.appendChild(el("span", "sub", "· hidden"));
      if (b.x !== undefined && spots.get(spot(b)) > 1) {
        const dup = el("span", "sub", "· stacked exactly on another banner — a duplicate?");
        dup.style.color = "var(--figma-color-text-warning)";
        label.appendChild(dup);
      }
      // Find it in Figma — the size alone doesn't tell same-size banners apart.
      const show = el("a", "sub", "Show");
      show.title = "Show this banner in Figma";
      show.style.cssText = "color:var(--figma-color-text-brand);cursor:pointer";
      show.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "focus", id: b.id } }, "*"));
      label.appendChild(show);
      const pill = el("span", "pill", "Not built");
      pill.id = `xs-${b.id}`;
      const why = el("div", "why");
      why.id = `xw-${b.id}`;
      row.appendChild(cb); row.appendChild(label); row.appendChild(pill); row.appendChild(why);
      list.appendChild(row);
    }
  }
  card.appendChild(list);
  out.appendChild(card);
  const pv = el("div", "card hidden");
  pv.id = "xpreview";
  out.appendChild(pv);
  exportButton();
}

function statusText(b) {
  if (b.error) return `✗ ${b.error}`;
  const blocks = b.out.results.filter(r => r.status === "block").length;
  const warns = b.out.results.filter(r => r.status === "warn").length;   // motion notes are among these
  const first = b.out.results.find(r => r.status === "block");
  return blocks ? `✗ Not to spec — ${first.rule.title.toLowerCase()}: ${first.detail}` + (blocks > 1 ? ` (+${blocks - 1} more)` : "")
    : `✓ Ready — ${Converter.kb(b.out.chosen.zipBytes)}, ${dur(b.duration)}${b.loops ? " a play, looping" : ""}` + (warns ? ` · ${warns} note${warns === 1 ? "" : "s"}` : "");
}

// A row's state while working: plain text in a neutral pill, no reason line.
function setStatus(id, text) {
  const s = document.getElementById(`xs-${id}`), w = document.getElementById(`xw-${id}`);
  if (s) { s.textContent = text; s.className = "pill busy"; }
  if (w) { w.innerHTML = ""; w.className = "why"; }
}

// A row's result: a short pill, and one line saying why — plus the fix, when
// there's one to offer.
function renderStatus(id, b) {
  const s = document.getElementById(`xs-${id}`), w = document.getElementById(`xw-${id}`);
  if (!s || !w) return;
  w.innerHTML = "";
  if (b.error) {
    s.textContent = "Error"; s.className = "pill err";
    w.className = "why err"; w.textContent = b.error;
    return;
  }
  const blocks = b.out.results.filter(r => r.status === "block");
  const notes = b.out.results.filter(r => r.status === "warn" || r.status === "fixed");
  if (blocks.length) {
    s.textContent = blocks.length > 1 ? `${blocks.length} to fix` : "To fix"; s.className = "pill err";
    w.className = "why err";
    w.appendChild(el("div", null, blocks[0].detail + (blocks[0].todo ? ` ${blocks[0].todo}` : "")));
    if (b.offerSize) {
      const btn = el("button", "ghost", `Export at ${b.offerSize} instead`);
      btn.title = "Exports a resized copy; your frame in Figma isn't changed.";
      btn.addEventListener("click", ev => { ev.stopPropagation(); fixSizeFor.add(id); built.delete(id); delete (out.querySelector(`input.xb[data-id="${id}"]`) || { dataset: {} }).dataset.built; buildAll(); });
      w.appendChild(btn);
    }
    return;
  }
  s.textContent = `${Converter.kb(b.out.chosen.zipBytes)} · ${dur(b.duration)}${b.loops ? " ↻" : ""}`; s.className = "pill ok";
  s.title = b.loops ? "Loops forever; the length shown is one play." : "";
  w.className = "why";
  if (notes.length) w.textContent = notes.map(n => n.detail).join(" ");
}

function updateSummary() {
  const sum = document.getElementById("xsum");
  if (!sum) return;
  const rs = [...built.values()], ok = rs.filter(r => r.ok).length, bad = rs.length - ok;
  sum.textContent = rs.length ? `· ${ok} ready${bad ? ` · ${bad} to fix` : ""}` : "";
}

async function buildOne(b) {
  setStatus(b.id, "Exporting from Figma…");
  const payload = await new Promise(res => { waiting.set(b.id, res); parent.postMessage({ pluginMessage: { type: "exportBanner", id: b.id, fixSize: fixSizeFor.has(b.id) } }, "*"); });
  if (payload.error) return { picked: true, ok: false, error: payload.error, payload: { name: b.name, where: b.where, width: b.w, height: b.h } };
  setStatus(b.id, "Rebuilding the animation…");
  await new Promise(r => setTimeout(r, 0));
  const anim = animateSvg(payload);
  setStatus(b.id, "Checking against spec and packaging…");
  // Frames are usually named by their size, which the file name adds anyway,
  // and version frames often share a name — so the headline's first words go
  // in too, to say which message each file carries.
  const named = SIZE.test(String(payload.name).trim()) || /^frame-?\d*$/i.test(slug(payload.name)) ? "" : `_${slug(payload.name)}`;
  const words = slug((payload.headline || "").split(" ").slice(0, 4).join(" "));
  const fileName = `${slug(payload.parent)}${named}${words ? "_" + words : ""}`;
  const outp = await Converter.run({ name: `${fileName}.svg`, text: async () => anim.svg }, exportLoop);
  // Motion that couldn't be carried across goes in the report as warnings.
  for (const note of anim.notes) outp.results.push({ rule: { id: "motion", title: "Motion" }, status: "warn", detail: note });
  // The delivered ad must be exactly the frame's size, and the frame exactly the
  // size its name promises. Either mismatch gets rejected by the ad server, so
  // both block rather than note.
  const sizeRule = { id: "frame-size", title: "Exports at the size the frame is meant to be" };
  // Fixes the plugin made on its export copy (clipping, a pixel of resizing).
  for (const f of payload.fixes || []) outp.results.push({ rule: { id: "size-fixed", title: "Fixed for export" }, status: "fixed", detail: f });
  if (outp.ctx && (outp.ctx.width !== payload.width || outp.ctx.height !== payload.height))
    outp.results.push(Object.assign({ rule: sizeRule }, {
      status: "block",
      detail: `The export came out ${outp.ctx.width}×${outp.ctx.height}, but the frame is ${payload.width}×${payload.height} — something renders past the frame's edge.`,
      todo: "Turn on Clip content for this frame, or move the overhanging layer (or its shadow) inside the edge." }));
  const promised = /^(\d+)\s*[x×X]\s*(\d+)$/.exec(String(payload.name).trim());
  const offerSize = promised && (+promised[1] !== payload.width || +promised[2] !== payload.height) ? `${promised[1]}×${promised[2]}` : "";
  if (offerSize)
    outp.results.push(Object.assign({ rule: sizeRule }, {
      status: "block",
      detail: `The frame is named ${promised[1]}×${promised[2]} but is actually ${payload.width}×${payload.height}.`,
      todo: `Resize the frame in Figma, or export a resized copy at ${promised[1]}×${promised[2]} below.` }));

  // If none of the animated layers converted, the web tool's "static export"
  // advice would mislead — say what actually happened instead.
  if (!anim.animatedLayers.length) {
    const r = outp.results.find(x => x.rule.id === "animation");
    const none = !payload.anims.length || payload.anims.every(a => a.isBanner);
    if (r) Object.assign(r, { status: "block",
      detail: none ? "Nothing inside this banner is animated (hidden layers and the frame itself don't count)."
        : `Figma reported ${payload.anims.length} animated layer${payload.anims.length === 1 ? "" : "s"}, but none of their animation could be read and converted.`,
      todo: none ? "Animate it in Figma, or untick it."
        : "Check the notes below for what couldn't be converted. If they don't explain it, open Technical details and send its contents to whoever maintains the plugin." });
  }
  const ok = !outp.blocked && !outp.results.some(r => r.status === "block");
  // The backup image that goes beside the zip: the end frame as a JPEG.
  let backup = null;
  if (ok) {
    setStatus(b.id, "Making the backup image…");
    backup = await Converter.makeBackup(outp);
    const backupRule = { id: "backup", title: "Backup image" };
    outp.results.push(backup.data
      ? { rule: backupRule, status: "pass", detail: `${Converter.kb(backup.bytes)} JPEG of the end frame, to go beside the zip.` }
      : { rule: backupRule, status: "warn", detail: `No backup image: ${backup.error}` });
    const endRule = { id: "end-frame", title: "Ends on the end card" };
    if (backup.blank) outp.results.push({ rule: endRule, status: "warn", detail: "The ad ends on a blank frame, so that's what it stops on and what the backup shows. Make the last moment of the timeline the end card." });
    else if (backup.sameAsStart) outp.results.push({ rule: endRule, status: "warn", detail: "The ad ends looking exactly like its first frame (a loop back to the start?). Check the end frame shows the call to action." });
  }
  // What the plugin received, for diagnosing a conversion that went wrong —
  // the keyframes and what came of them, without the (huge) SVG.
  const details = JSON.stringify({ banner: `${payload.where} › ${payload.name}`, converted: anim.animatedLayers, notes: anim.notes,
    layers: payload.anims.map(a => ({ name: a.name, type: a.type, token: a.token, center: a.center, opacity: a.opacity,
      foundInSvg: payload.svg.includes(`"${a.token}"`) || new RegExp(`id="[^"]*${a.token}"`).test(payload.svg),
      presets: a.presets, trace: a.trace, animations: a.animations })),
    presetsOfferedToPlugins: payload.offered,
    svgKB: Math.round(payload.svg.length / 1024) }, null, 1);
  // A banner that loops forever has no total; its length is one play.
  const plays = exportLoop.plays, loops = plays === Infinity;
  const between = plays > 1 ? exportLoop.pause + exportLoop.fade : 0;
  const total = loops ? anim.duration : plays * anim.duration + (plays - 1) * between;
  // What a preview covers: a looping banner's whole cycle (play, pause, fade).
  const span = loops ? anim.duration + exportLoop.pause + exportLoop.fade : total;
  if (outp.ctx) outp.ctx = { width: outp.ctx.width, height: outp.ctx.height };
  return { picked: true, ok, out: outp, backup, notes: anim.notes, duration: total, span, onePlay: anim.duration, loops, fileName, offerSize, details, payload: { name: payload.name, where: payload.full || payload.where, width: payload.width, height: payload.height, headline: payload.headline || "" } };
}

async function buildAll() {
  // Asked again mid-build ("Export at W×H instead"): picked up when this run ends.
  if (building) { buildAgain = true; return; }
  const ids = [...out.querySelectorAll("input.xb:checked")].map(c => c.dataset.id).filter(id => !built.has(id));
  building = true; uiStop = false; buildAgain = false;
  out.querySelectorAll("input.xb, input.xg, #xall").forEach(c => { c.disabled = true; });
  stop.classList.remove("hidden"); stop.disabled = false; stop.textContent = "Stop";
  clear.classList.add("hidden");
  document.querySelectorAll(".modes button").forEach(b => { b.disabled = true; });
  exportButton();
  try {
  for (const [i, id] of ids.entries()) {
    if (uiStop) break;
    const b = exportPlan.find(x => x.id === id);
    go.textContent = `Building ${i + 1} of ${ids.length}…`;
    if (!b) continue;
    const gen = buildGen;
    let r;
    try { r = await buildOne(b); } catch (e) { r = { picked: true, ok: false, error: String((e && e.message) || e), payload: { name: b.name, where: b.where, width: b.w, height: b.h } }; }
    // The settings changed while it built: it's built again with the new ones.
    if (gen !== buildGen) { setStatus(id, "Build again"); continue; }
    // Stopped part-way: that banner simply wasn't built — it isn't a failure.
    if (uiStop && r.error) {
      setStatus(id, "Not built");
      const pill = document.getElementById(`xs-${id}`);
      if (pill) pill.className = "pill";
      break;
    }
    built.set(id, r);
    renderStatus(id, r);
    const cb = out.querySelector(`input.xb[data-id="${id}"]`);
    if (cb) cb.dataset.built = "1";
    if (previewId === null && r.ok) showBanner(id);
  }
  // Nothing passed: open the first failure so the reason is on screen.
  if (previewId === null) { const failed = ids.find(id => built.has(id)); if (failed) showBanner(failed); }
  } catch (e) {
    result.innerHTML = "";
    result.appendChild(el("div", "card err", `Building stopped: ${(e && e.message) || e}`));
  }
  building = false;
  stop.classList.add("hidden");
  document.querySelectorAll(".modes button").forEach(b => { b.disabled = false; });
  out.querySelectorAll("input.xb, input.xg, #xall").forEach(c => { c.disabled = false; });
  // The page changed while building: its own banners replace this list.
  if (laterPlan) { const p = laterPlan; laterPlan = null; if (view === "plan") return render(p); stashedPlan = p; }
  exportButton();
  if (buildAgain && !uiStop) buildAll();
}

// The preview plays the real packaged output, images inlined, in a sandboxed
// frame with a scrubber — the same view as the web tool's Inspect tab.
const SEEK = `<script>window.addEventListener("message",function(e){var d=e.data||{},a=document.getAnimations();
if(d.cmd==="seek"){a.forEach(function(x){x.pause();x.currentTime=d.t;});}
else if(d.cmd==="play"){a.forEach(function(x){x.currentTime=0;x.play();});}});<\/script>`;

function previewHtml(o) {
  let html = o.html;
  for (const a of o.assets) {
    let bin = "";
    for (let i = 0; i < a.data.length; i += 0x8000) bin += String.fromCharCode.apply(null, a.data.subarray(i, i + 0x8000));
    html = html.split(a.name).join(`data:${a.type};base64,${btoa(bin)}`);
  }
  return html.replace(/<\/body>/i, SEEK + "</body>");
}

function showBanner(id) {
  const b = built.get(id);
  const pv = document.getElementById("xpreview");
  if (!pv) return;
  pv.classList.remove("hidden");
  pv.innerHTML = "";
  if (!b) { pv.appendChild(el("div", "muted", "Build this banner first to preview it.")); return; }
  previewId = id;
  // Built from the banner as it was: after editing it in Figma (or a component
  // it uses), build it again here.
  if (!building) {
    const again = el("a", null, "Build again");
    again.title = "Export this banner from Figma again, e.g. after editing it";
    again.style.cssText = "float:right;color:var(--figma-color-text-brand);cursor:pointer";
    again.addEventListener("click", () => {
      built.delete(id);
      const cb = out.querySelector(`input.xb[data-id="${id}"]`);
      if (cb) { cb.checked = true; delete cb.dataset.built; }
      buildAll();
    });
    pv.appendChild(again);
  }
  // The full path already ends with the banner's name.
  const path = b.payload ? (b.payload.where.endsWith(b.payload.name) ? b.payload.where : `${b.payload.where} › ${b.payload.name}`) : "Banner";
  const title = el("b", null, shortWhere(path, 2));
  title.title = path;
  pv.appendChild(title);
  if (b.error) { pv.appendChild(el("div", "err", b.error)); return; }
  pv.appendChild(el("div", b.ok ? "ok" : "err", statusText(b)));

  // A banner that failed an early check was never packaged, so there's
  // nothing to play — show why instead.
  if (!b.out.chosen) {
    pv.appendChild(el("div", "muted", "This banner stopped at an early check, so there's no preview. The reason is below."));
  } else {
  const W = b.out.ctx.width, H = b.out.ctx.height;
  const avail = Math.min(380, out.clientWidth - 40);
  const scale = Math.min(1, avail / W, 420 / H);
  const stage = el("div");
  stage.style.cssText = `position:relative;width:${Math.round(W * scale)}px;height:${Math.round(H * scale)}px;margin-top:8px;overflow:hidden;border:1px solid var(--figma-color-border);background:#000`;
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts");
  f.width = W; f.height = H;
  f.style.cssText = `border:0;position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(${scale})`;
  f.srcdoc = previewHtml(b.out);
  stage.appendChild(f);
  pv.appendChild(stage);

  const D = (b.span || b.duration) * 1000;
  // A looping banner's end frame is the end of its motion, before any pause
  // or fade; a moment before, if the next loop would start right there.
  const endAt = b.loops ? Math.min(b.duration * 1000, D - 30) : D;
  const row = el("div", "btns"); row.style.marginTop = "8px";
  const play = el("button", "ghost", "Play");
  const end = el("button", "ghost", "End frame");
  const time = el("span", "muted", `${dur(b.duration)}`);
  const scrub = el("input"); scrub.type = "range"; scrub.min = 0; scrub.max = 1000; scrub.value = 0; scrub.style.width = "100%";
  // A banner that loops is back at its first frame the instant a play ends,
  // so its end is shown a moment before.
  const seek = ms => {
    const t = b.loops ? Math.min(ms, Math.max(0, D - 30)) : ms;
    f.contentWindow.postMessage({ cmd: "seek", t }, "*");
    time.textContent = `${(ms / 1000).toFixed(2)}s / ${dur(D / 1000)}`;
  };
  play.addEventListener("click", () => f.contentWindow.postMessage({ cmd: "play" }, "*"));
  end.addEventListener("click", () => { scrub.value = Math.round(1000 * endAt / D); seek(endAt); });
  scrub.addEventListener("input", () => seek(D * scrub.value / 1000));
  row.appendChild(play); row.appendChild(end); row.appendChild(time);
  pv.appendChild(row);
  pv.appendChild(scrub);
  pv.appendChild(el("div", "muted", b.loops
    ? "Loops forever; this plays one loop. Check the jump from the end back to the start looks clean — fading everything out at the end of the timeline avoids a jump."
    : "Check the end frame shows the call to action — the ad stops there."));
  if (b.backup && b.backup.data) {
    const cap = el("div", "muted", `Backup image (${Converter.kb(b.backup.bytes)} JPEG, goes beside the zip):`);
    cap.style.marginTop = "8px";
    pv.appendChild(cap);
    const im = document.createElement("img");
    im.src = URL.createObjectURL(new Blob([b.backup.data], { type: "image/jpeg" }));
    im.onload = im.onerror = () => URL.revokeObjectURL(im.src);
    im.style.cssText = `display:block;width:${Math.round(W * scale)}px;height:${Math.round(H * scale)}px;margin-top:4px;border:1px solid var(--figma-color-border)`;
    pv.appendChild(im);
  }
  }

  const checks = el("details");
  checks.appendChild(el("summary", "muted", "Spec checks"));
  for (const r of b.out.results) {
    const line = el("div", "row");
    line.appendChild(el("span", r.status === "block" ? "err" : r.status === "warn" ? "warn" : "muted", r.status.toUpperCase()));
    const t = el("div");
    t.appendChild(el("div", null, r.rule.title));
    t.appendChild(el("div", "where", r.detail + (r.todo ? ` — Change in Figma: ${r.todo}` : "")));
    line.appendChild(t);
    checks.appendChild(line);
  }
  if (b.out.results.some(r => r.status !== "pass")) checks.open = true;
  pv.appendChild(checks);
  if (b.details) {
    const tech = el("details");
    tech.appendChild(el("summary", "muted", "Technical details (for the plugin maintainer)"));
    const ta = el("textarea");
    ta.readOnly = true;
    ta.value = b.details;
    ta.style.cssText = "width:100%;height:160px;font:11px ui-monospace,monospace;background:var(--figma-color-bg-secondary);color:var(--figma-color-text);border:1px solid var(--figma-color-border)";
    ta.addEventListener("focus", () => ta.select());
    tech.appendChild(ta);
    const copyBtn = el("button", "ghost", "Copy technical details");
    copyBtn.addEventListener("click", () => {
      ta.focus(); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { /* fall back to ⌘C */ }
      copyBtn.textContent = ok ? "Copied — paste it to the plugin maintainer" : "Selected — press ⌘C";
    });
    tech.appendChild(copyBtn);
    pv.appendChild(tech);
  }
  pv.scrollIntoView({ block: "nearest" });
}

/* ============================================================== gallery ==== */
// Every built banner playing side by side in a larger window, driven
// together: play all from the start, scrub all to the same moment, or jump all
// to their end frames. Paged, so a big export doesn't put a hundred live ads on
// screen at once. Clicking a banner opens its full preview and checks.
const PAGE = 12, BIG_W = 1000, BIG_H = 760, SMALL_W = 440, SMALL_H = 620;
let galleryFilter = "all", galleryPage = 0;

function galleryItems() {
  const items = exportPlan.filter(b => built.has(b.id)).map(b => ({ plan: b, r: built.get(b.id) }));
  return galleryFilter === "ready" ? items.filter(i => i.r.ok)
       : galleryFilter === "bad" ? items.filter(i => !i.r.ok) : items;
}

function openGallery() {
  parent.postMessage({ pluginMessage: { type: "resize", w: BIG_W, h: BIG_H } }, "*");
  galleryPage = 0;
  let g = document.getElementById("gallery");
  if (!g) { g = el("div"); g.id = "gallery"; document.body.appendChild(g); }
  renderGallery();
}

function closeGallery(thenShow) {
  const g = document.getElementById("gallery");
  if (g) g.remove();   // removing the frames also stops them
  parent.postMessage({ pluginMessage: { type: "resize", w: SMALL_W, h: SMALL_H } }, "*");
  if (thenShow) showBanner(thenShow);
}

function renderGallery() {
  const g = document.getElementById("gallery");
  g.innerHTML = "";
  const items = galleryItems(), pages = Math.max(1, Math.ceil(items.length / PAGE));
  galleryPage = Math.min(galleryPage, pages - 1);
  const shown = items.slice(galleryPage * PAGE, galleryPage * PAGE + PAGE);
  const longest = Math.max(0.05, ...shown.filter(i => i.r.ok).map(i => i.r.span || i.r.duration));

  const head = el("div", "ghead");
  const back = el("button", "ghost", "← Back");
  back.addEventListener("click", () => closeGallery());
  const filter = el("select");
  const ready = [...built.values()].filter(r => r.ok).length;
  for (const [v, t] of [["all", `All ${built.size}`], ["ready", `Ready ${ready}`], ["bad", `Not to spec ${built.size - ready}`]]) {
    const o = el("option", null, t); o.value = v; filter.appendChild(o);
  }
  filter.value = galleryFilter;
  filter.addEventListener("change", () => { galleryFilter = filter.value; galleryPage = 0; renderGallery(); });
  const frames = [];
  const tell = msg => frames.forEach(f => { try { f.contentWindow.postMessage(msg, "*"); } catch (e) { /* not loaded yet */ } });
  const play = el("button", null, "Play all");
  play.addEventListener("click", () => tell({ cmd: "play" }));
  const ends = el("button", "ghost", "End frames");
  const scrub = el("input"); scrub.type = "range"; scrub.min = 0; scrub.max = 1000; scrub.value = 0; scrub.style.flex = "1"; scrub.style.minWidth = "160px";
  const time = el("span", "muted", `0.00s / ${dur(longest)}`);
  scrub.addEventListener("input", () => {
    const ms = longest * 1000 * scrub.value / 1000;
    // A looping banner shown at or past the end of its play would wrap to its
    // first frame; hold it just before.
    shown.forEach((i, k) => {
      if (!frames[k]) return;
      const t = i.r.loops ? Math.min(ms, (i.r.span || i.r.duration) * 1000 - 30) : ms;
      try { frames[k].contentWindow.postMessage({ cmd: "seek", t }, "*"); } catch (e) { /* not loaded yet */ }
    });
    time.textContent = `${(ms / 1000).toFixed(2)}s / ${dur(longest)}`;
  });
  ends.addEventListener("click", () => {
    // Each to its own end, since lengths can differ.
    shown.forEach((i, k) => { if (frames[k] && i.r.ok) frames[k].contentWindow.postMessage({ cmd: "seek", t: i.r.loops ? Math.min(i.r.duration * 1000, i.r.span * 1000 - 30) : i.r.duration * 1000 }, "*"); });
    scrub.value = 1000; time.textContent = "End frames";
  });
  head.appendChild(back); head.appendChild(filter); head.appendChild(play); head.appendChild(ends); head.appendChild(scrub); head.appendChild(time);
  if (pages > 1) {
    const prev = el("button", "ghost", "‹"), next = el("button", "ghost", "›");
    prev.disabled = galleryPage === 0; next.disabled = galleryPage >= pages - 1;
    prev.addEventListener("click", () => { galleryPage--; renderGallery(); });
    next.addEventListener("click", () => { galleryPage++; renderGallery(); });
    head.appendChild(prev); head.appendChild(el("span", "muted", `Page ${galleryPage + 1} of ${pages}`)); head.appendChild(next);
  }
  g.appendChild(head);

  const grid = el("div", "ggrid");
  if (!shown.length) grid.appendChild(el("div", "muted", "Nothing to show with this filter."));
  for (const { plan, r } of shown) {
    const tile = el("div", "tile");
    const W = r.out && r.out.ctx ? r.out.ctx.width : plan.w, H = r.out && r.out.ctx ? r.out.ctx.height : plan.h;
    const scale = Math.min(1, 300 / W, 260 / H);
    const box = el("div", `frame${r.ok ? "" : " bad"}`);
    box.style.width = `${Math.round(W * scale)}px`;
    box.style.height = `${Math.round(H * scale)}px`;
    if (r.out && r.out.chosen) {
      const f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-scripts");
      f.width = W; f.height = H;
      f.style.transform = `scale(${scale})`;
      f.srcdoc = previewHtml(r.out);
      box.appendChild(f);
      frames.push(f);
    } else {
      frames.push(null);
      const why = el("div", "muted", r.error || "Stopped at an early check — click for the reason.");
      why.style.cssText = "padding:8px;font-size:11px;color:#ccc";
      box.appendChild(why);
    }
    tile.appendChild(box);
    const cap = el("div", "cap");
    cap.appendChild(el("div", r.ok ? "ok" : "err", `${r.ok ? "✓" : "✗"} ${W}×${H}${r.ok ? ` · ${Converter.kb(r.out.chosen.zipBytes)} · ${dur(r.duration)}${r.loops ? " ↻" : ""}` : ""}`));
    // Many banners share a headline, so say which group each one is in too.
    const group = String(plan.where || "").split(" › ").pop();
    const headline = (r.payload && r.payload.headline) || "";
    const sub = el("div", "where", [group, headline].filter(Boolean).join(" · "));
    sub.title = plan.where;
    cap.appendChild(sub);
    tile.appendChild(cap);
    tile.title = "Open this banner's full preview and checks";
    tile.addEventListener("click", () => closeGallery(plan.id));
    grid.appendChild(tile);
  }
  g.appendChild(grid);
}

// A banner's zip, with its <title> set to the file's name when the delivery
// layout names it (the build used the Figma frame's name).
async function bannerZip(b, title) {
  const files = title ? b.out.chosen.files.map(f => f.name !== "index.html" ? f
    : { name: f.name, data: new TextEncoder().encode(new TextDecoder().decode(f.data).replace(/<title>[^<]*<\/title>/, `<title>${title}</title>`)) })
    : b.out.chosen.files;
  return new Uint8Array(await (await Converter.makeZip(files)).arrayBuffer());
}

// One download at a time; the files of the last one are let go when the next starts.
let downloadUrls = [];
const keepUrl = u => { downloadUrls.push(u); return u; };
async function downloadAll() {
  if (downloading) return;
  downloading = true;
  go.disabled = true;
  downloadUrls.forEach(u => URL.revokeObjectURL(u)); downloadUrls = [];
  try { await packageDownload(); }
  catch (e) {
    result.innerHTML = "";
    result.appendChild(el("div", "card err", `The download couldn't be made: ${(e && e.message) || e}. Build again and retry.`));
  } finally { downloading = false; exportButton(); }
}
async function packageDownload() {
  const ticked = new Set([...out.querySelectorAll("input.xb:checked")].map(c => c.dataset.id));
  const pairs = [...built.entries()].filter(([id]) => ticked.has(id));
  const entries = pairs.map(([, b]) => b);
  const files = [], used = new Set(), csv = [["file", "banner", "where", "headline", "size", "status", "kb", "seconds", "notes"]];
  const date = localDate();
  const notesOf = b => b.out.results.filter(r => r.status === "warn" || r.status === "fixed").map(r => r.detail);
  const seconds = b => b.loops ? `${n3(b.duration)} per play, loops forever` : n3(b.duration);
  let fileName, folders = 0, missing = [], unplaced = [], noBackup = 0, notes = [];
  const layout = delivery.on;
  if (layout) {
    // One file per version code and size, filled by the first ticked banner that
    // passed. The report keeps what was left out, and why.
    const picks = deliveryPicks(ticked);
    if (!picks.out.length) {
      result.innerHTML = "";
      result.appendChild(el("div", "card warn", "Nothing to download: no ticked banner that passed belongs to a version with a code. Give the versions their codes under Delivery folders."));
      return;
    }
    const root = prefixed(`HTML5_${date}`);
    const inFolder = new Set();
    for (const p of picks.out) {
      const b = built.get(p.id);
      const zipData = await bannerZip(b, p.stem);
      files.push({ name: `${root}/${p.folder}/${p.stem}.zip`, data: zipData });
      if (b.backup && b.backup.data) files.push({ name: `${root}/${p.folder}/${p.stem}.jpg`, data: b.backup.data });
      else noBackup++;
      inFolder.add(p.folder);
      if (p.clash) notes.push(`${p.stem}: two versions share its code; the first was used`);
      else if (p.twice) notes.push(`${p.stem}: more than one banner of this size in its version; the first that passed was used`);
      csv.push([`${p.folder}/${p.stem}.zip`, b.payload.name, b.payload.where, b.payload.headline || "", p.size, "ready", (zipData.length / 1024).toFixed(1), seconds(b), notesOf(b).join(" | ")]);
    }
    missing = picks.left;
    for (const [id, b] of pairs) if (b.ok && !picks.placed.has(id)) unplaced.push(`${b.payload.where} › ${b.payload.name}`);
    for (const m of missing) csv.push(["", "", "", "", "", "left out", "", "", m]);
    for (const n of notes) csv.push(["", "", "", "", "", "note", "", "", n]);
    for (const u of unplaced) csv.push(["", u, "", "", "", "passed, but not placed (no code, or another banner fills its file)", "", "", ""]);
    for (const b of entries) if (!b.ok) csv.push(["", b.payload ? b.payload.name : "?", b.payload ? b.payload.where : "", b.payload ? b.payload.headline || "" : "", b.payload ? `${b.payload.width}x${b.payload.height}` : "", b.error ? "error" : "not to spec", "", "", b.error || b.out.results.filter(r => r.status === "block").map(r => r.detail).join(" | ")]);
    folders = inFolder.size;
    fileName = `${root}.zip`;
  } else {
    for (const b of entries) {
      const name = b.payload ? b.payload.name : "?";
      const headline = b.payload ? b.payload.headline || "" : "";
      if (!b.ok) { csv.push(["", name, b.payload ? b.payload.where : "", headline, b.payload ? `${b.payload.width}x${b.payload.height}` : "", b.error ? "error" : "not to spec", "", "", b.error || b.out.results.filter(r => r.status === "block").map(r => r.detail).join(" | ")]); continue; }
      let fn = `${b.fileName}_${b.out.ctx.width}x${b.out.ctx.height}`, k = 2;
      while (used.has(fn.toLowerCase())) fn = `${b.fileName}_${b.out.ctx.width}x${b.out.ctx.height}-${k++}`;
      used.add(fn.toLowerCase());
      files.push({ name: `${fn}.zip`, data: await bannerZip(b) });
      // The backup goes beside the zip with the same name, as ad servers expect.
      if (b.backup && b.backup.data) files.push({ name: `${fn}.jpg`, data: b.backup.data });
      else noBackup++;
      // Everything worth knowing about a banner that passed: automatic size fixes
      // and motion that couldn't be carried across, both from its checks.
      csv.push([`${fn}.zip`, name, b.payload.where, headline, `${b.out.ctx.width}x${b.out.ctx.height}`, "ready", (b.out.chosen.zipBytes / 1024).toFixed(1), seconds(b), notesOf(b).join(" | ")]);
    }
    fileName = `html5-banners-${date}.zip`;
  }
  const esc = v => `"${String(v).replace(/^[=+\-@]/, "'$&").replace(/"/g, '""')}"`;
  const report = new TextEncoder().encode("\ufeff" + csv.map(r => r.map(esc).join(",")).join("\n"));
  // In the delivery layout the report stays out of the zip, so the zip can go
  // to the client as it is; it's offered separately below.
  if (!layout) files.push({ name: "report.csv", data: report });
  const zip = await Converter.makeZip(files);
  const url = keepUrl(URL.createObjectURL(zip));
  // Figma's plugin frame can block a download started from code after a
  // wait, so the file is also offered as a link to click — a direct click on
  // a download link is allowed.
  const auto = document.createElement("a");
  auto.href = url; auto.download = fileName;
  document.body.appendChild(auto);
  try { auto.click(); } catch (e) { /* the link below still works */ }
  auto.remove();
  result.innerHTML = "";
  const card = el("div", "card");
  const zips = files.filter(f => f.name.endsWith(".zip")).length, jpgs = files.filter(f => f.name.endsWith(".jpg")).length;
  const notReady = entries.filter(b => !b.ok).length;
  card.appendChild(el("div", "ok", layout
    ? `${zips} banner${zips === 1 ? "" : "s"} in ${folders} folder${folders === 1 ? "" : "s"}${noBackup ? `, ${jpgs} with a backup .jpg` : ", each with its backup .jpg"}.`
    : `${zips} banner${zips === 1 ? "" : "s"} packaged, ${jpgs} with a backup .jpg beside it, with a report.csv.`));
  const save = el("a", null, `Save ${fileName} (${Converter.fmt(zip.size)})`);
  save.href = url; save.download = fileName;
  save.style.cssText = "display:inline-block;margin-top:6px;font-weight:600;color:var(--figma-color-text-brand)";
  card.appendChild(save);
  card.appendChild(el("div", "muted", "It saves to your Downloads folder. If nothing appeared there, click the link above."));
  card.appendChild(el("div", "warn", "Before delivering: open the banners and check each one yourself. This tool is in development and its checks can miss things."));
  if (layout) {
    const rep = el("a", null, "Save the report (.csv)");
    rep.href = keepUrl(URL.createObjectURL(new Blob([report], { type: "text/csv" }))); rep.download = fileName.replace(/\.zip$/, "_report.csv");
    rep.style.cssText = "display:inline-block;margin-top:4px;color:var(--figma-color-text-brand)";
    card.appendChild(rep);
  }
  if (missing.length) card.appendChild(el("div", missing.some(m => !/not ticked\)$/.test(m)) ? "warn" : "muted", `Left out (${missing.length}): ${missing.slice(0, 10).join(", ")}${missing.length > 10 ? ", …" : ""}.`));
  if (notes.length) card.appendChild(el("div", "warn", notes.slice(0, 6).join(". ") + (notes.length > 6 ? ". …" : ".")));
  if (unplaced.length) card.appendChild(el("div", "warn", `${unplaced.length} banner${unplaced.length === 1 ? " passed but isn't" : "s passed but aren't"} in the download (no code, or another banner fills the file) — see the report.`));
  if (noBackup) card.appendChild(el("div", "warn", `${noBackup} banner${noBackup === 1 ? " has" : "s have"} no backup image — see each banner's checks.`));
  if (notReady) card.appendChild(el("div", "warn", `${notReady} banner${notReady === 1 ? " was" : "s were"} left out because ${notReady === 1 ? "it isn't" : "they aren't"} to spec — see the report.`));
  result.appendChild(card);
}

let currentMode = "content";
document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => {
  currentMode = b.dataset.mode;
  // Export has nothing to do with removing animation; the count isn't made there.
  syncFooter();
}));

go.addEventListener("click", () => {
  if (currentMode === "export") {
    if (go.dataset.action === "download") downloadAll();
    else buildAll();
    return;
  }
  // A big run takes a second click that states its size.
  let n = 0;
  out.querySelectorAll("input.t:checked").forEach(c => { n += Number(c.dataset.n || 1); });
  if (n > BIG && !goArmed) {
    go.classList.add("danger");
    go.textContent = `Click again to change ${n.toLocaleString()} layers`;
    goArmed = setTimeout(count, 5000);
    return;
  }
  clearTimeout(goArmed); goArmed = null;
  if (currentMode === "suite") {
    const steps = [...out.querySelectorAll("input.t:checked")].map(c => Number(c.dataset.step));
    go.disabled = true;
    go.textContent = "Copying…";
    result.innerHTML = "";
    parent.postMessage({ pluginMessage: { type: "applySuite", steps } }, "*");
    return;
  }
  const targets = {};
  const add = (src, id) => { (targets[src] = targets[src] || []).push(id); };
  out.querySelectorAll("input.t:checked").forEach(c => {
    if (c.dataset.pairs) JSON.parse(c.dataset.pairs).forEach(([src, id]) => add(src, id));
    else add(c.dataset.src, c.dataset.id);
  });
  go.disabled = true;
  go.textContent = "Copying…";
  result.innerHTML = "";
  parent.postMessage({ pluginMessage: { type: "apply", targets } }, "*");
});

onmessage = ev => {
  const msg = ev.data.pluginMessage;
  if (!msg) return;
  if (msg.type === "progress") {
    const st = document.getElementById("status");
    st.textContent = msg.text || "Ready";
    st.title = msg.text || "";
    st.classList.toggle("busy", !!msg.text);
  }
  if (msg.type === "crash") {
    if (!String(msg.text).startsWith("Scanning")) releaseWaiting(msg.text);
    // A scan that tripped while banners build is retried later; the build carries on.
    if (building && String(msg.text).startsWith("Scanning")) return;
    result.innerHTML = "";
    const card = el("div", "card");
    card.appendChild(el("div", "err", msg.text));
    if (msg.detail) card.appendChild(el("pre", "where", msg.detail));
    card.appendChild(el("div", "muted", msg.text.startsWith("Scanning")
      ? "A scan doesn't change anything, so the file is untouched. Copy this message to whoever maintains the plugin."
      : "Some layers may already have changed. Browse restore points (below) to put them back — not ⌘Z, which undoes a long run only in pieces. Copy this message to whoever maintains the plugin."));
    result.appendChild(card);
    go.disabled = false;
    count();
  }
  if (msg.type === "clearReview") renderClearReview(msg);
  if (msg.type === "settings") {
    exportAllOn = !!msg.exportAll;
    useDelivery(msg.delivery);
  }
  // A new scan means the selection or page changed; a review would be stale.
  if (msg.type === "others" && msg.count === null) { const r = document.getElementById("review"); if (r) r.remove(); }
  if (msg.type === "history") {
    points = msg.points || [];
    historyInfo = { page: msg.page || "", error: msg.error || "" };
    historyLabel();
    if (view === "history" && !document.getElementById("review")) renderHistory(true);
  }
  if (msg.type === "goBackReview") renderGoBackReview(msg);
  if (msg.type === "running") {
    stop.classList.toggle("hidden", !msg.on);
    stop.disabled = false;
    stop.textContent = "Stop";
    runningNow = !!msg.on;
    syncFooter();
  }
  if (msg.type === "restored") {
    result.innerHTML = "";
    const card = el("div", "card");
    card.appendChild(el("div", msg.failed.length ? "err" : "ok",
      `Restored ${msg.restored} layer${msg.restored === 1 ? "" : "s"} to how they were before “${msg.label}”` +
      (msg.stopped ? " — stopped part-way. Going back again finishes it." : msg.failed.length ? `, ${msg.failed.length} couldn't be:` : ".")));
    for (const f of msg.failed.slice(0, 5)) card.appendChild(el("div", "muted", `${f.where}: ${f.error}`));
    if (msg.failed.length > 5) card.appendChild(el("div", "muted", `…and ${msg.failed.length - 5} more.`));
    if (msg.versionSaved) card.appendChild(el("div", "muted", "A version was saved first — File › Show version history rolls back to it."));
    result.appendChild(card);
  }
  if (msg.type === "exported") { const res = waiting.get(msg.id); if (res) { waiting.delete(msg.id); res(msg); } }
  // Banners edited in Figma since they were built: those builds are out of
  // date, so they're dropped and built again rather than downloaded.
  if (msg.type === "stale" && currentMode === "export") {
    let n = 0;
    for (const id of msg.ids || []) {
      if (!built.has(id) || waiting.has(id)) continue;
      built.delete(id); n++;
      const cb = out.querySelector(`input.xb[data-id="${id}"]`);
      if (cb) delete cb.dataset.built;
      setStatus(id, "Changed in Figma — build again");
      const pill = document.getElementById(`xs-${id}`);
      if (pill) pill.className = "pill";
      if (previewId === id) showBanner(id);
    }
    if (n && !building) exportButton();
  }
  if (msg.type === "plan") {
    // A selection change mid-build mustn't wipe the list; another page's list
    // is shown once the build ends.
    if (building) { if (msg.mode === "export" && msg.page && msg.page !== listPage) laterPlan = msg; return; }
    if (view === "plan") render(msg); else stashedPlan = msg;
  }
  if (msg.type === "others") { others = msg.count; selected = msg.selected; clearLabel(); }
  if (msg.type === "cleared") {
    result.innerHTML = "";
    const card = el("div", "card");
    card.appendChild(el("div", msg.failed.length ? "err" : "ok",
      msg.refused ? "Select what to keep first. With nothing selected this would clear the whole page."
      : `Removed animation from ${msg.cleared} layer${msg.cleared === 1 ? "" : "s"}` +
        (msg.stopped ? " — stopped part-way. A restore point covers what was removed." : msg.failed.length ? `, ${msg.failed.length} couldn't be cleared:` : ". A restore point can bring it back.") +
        (msg.vanished ? ` ${msg.vanished} layer${msg.vanished === 1 ? "" : "s"} had already been rebuilt by Figma and were skipped.` : "")));
    if (msg.versionSaved) card.appendChild(el("div", "muted", "A version was saved first — File › Show version history rolls back to it."));
    for (const f of msg.failed.slice(0, 5)) card.appendChild(el("div", "muted", `${f.where}: ${f.error}`));
    result.appendChild(card);
  }
  if (msg.type === "done") {
    result.innerHTML = "";
    const card = el("div", "card");
    card.appendChild(el("div", msg.failed.length ? "err" : "ok",
      (msg.stopped ? `Stopped after ${msg.done} of ${msg.total.toLocaleString()} layers` : `Copied to ${msg.done} layer${msg.done === 1 ? "" : "s"}`) +
      (msg.failed.length ? `, ${msg.failed.reduce((n, f) => n + (f.count || 1), 0)} not copied:` : ".") +
      (msg.stopped ? " A restore point covers what was copied." : "")));
    // The same error usually repeats on every banner; show it once with a count,
    // and enough about each layer to find it and see why Figma refused it.
    const groups = new Map();
    for (const f of msg.failed) {
      const g = groups.get(f.error) || { n: 0, items: [] };
      g.n += f.count || 1;
      if (g.items.length < 5) g.items.push(f);
      groups.set(f.error, g);
    }
    for (const [error, g] of groups) {
      card.appendChild(el("div", null, `${g.n} × ${error}`));
      for (const f of g.items) {
        const row = el("div", "row");
        const txt = el("div");
        if (f.id) {
          const a = el("a", null, "Show");
          a.addEventListener("click", () => parent.postMessage({ pluginMessage: { type: "focus", id: f.id } }, "*"));
          row.appendChild(a);
        }
        txt.appendChild(whereEl(f.where, 3));
        if (f.detail) txt.appendChild(el("div", "where", f.detail));
        row.appendChild(txt);
        card.appendChild(row);
      }
    }
    if (msg.versionSaved) card.appendChild(el("div", "muted", "A version was saved first — File › Show version history rolls back to it."));
    if (msg.extended) card.appendChild(el("div", "muted",
      `Lengthened ${msg.extended} timeline${msg.extended === 1 ? "" : "s"} to fit the copied animation.`));
    result.appendChild(card);
    count();
  }
};
// The plugin can post before this panel is listening, so ask for the restore
// state once it is.
parent.postMessage({ pluginMessage: { type: "ready" } }, "*");
</script>
